<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة المشرف — Al Noor Gaming Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#CE1126; --deep:#7E0A19; --gold:#F5B800; --teal:#0B6F8A;
  --bg:#FFF8F2; --card:#FFFFFF; --ink:#2B0A10; --sub:#7A4A52; --line:rgba(126,10,25,.16); --soft:rgba(206,17,38,.07);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root{--bg:#1A0C10; --card:#2A141B; --ink:#FBEFF1; --sub:#D9A9B1; --line:rgba(255,255,255,.16); --soft:rgba(255,255,255,.06)}}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:'Cairo',system-ui,sans-serif; min-height:100vh; padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit; color:inherit}
.top{background:linear-gradient(135deg,var(--red),var(--deep)); color:#fff; padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px}
.top .in{max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.top h1{margin:0; font-size:1.25rem; font-weight:900; flex:1; min-width:180px}
.top .chip2{background:rgba(255,255,255,.18); border-radius:999px; padding:5px 14px; font-weight:700; font-size:.88rem}
.wrap{max-width:1100px; margin:0 auto; padding:26px 20px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1.5px solid transparent; border-radius:12px; padding:10px 18px; font-weight:800; cursor:pointer; transition:.16s; white-space:nowrap}
a.btn{text-decoration:none}
.btn:disabled{opacity:.55; cursor:default}
.btn.primary{background:linear-gradient(135deg,#E8283D,var(--red) 55%,var(--deep)); color:#fff; box-shadow:0 10px 20px -12px var(--red)}
.btn.primary:not(:disabled):hover{transform:translateY(-1px)}
.btn.ghost{background:transparent; border-color:var(--line); color:var(--ink)}
.btn.ghost:not(:disabled):hover{border-color:var(--red); background:var(--soft)}
.btn.light{background:rgba(255,255,255,.18); color:#fff}
.btn.light:hover{background:rgba(255,255,255,.3)}
.btn.sm{padding:7px 14px; font-size:.9rem}
.ib{display:inline-grid; place-items:center; width:38px; height:38px; border-radius:10px; border:1.5px solid var(--line); background:transparent; cursor:pointer; font-size:1.05rem; transition:.16s}
.ib:hover{border-color:var(--red); background:var(--soft)}
.ib.danger:hover{background:var(--red); color:#fff; border-color:var(--red)}
.ib:disabled{opacity:.4; cursor:default}
.field{display:grid; gap:6px; margin-bottom:16px}
.field>label{font-weight:800; font-size:.95rem}
.field small,.hint{color:var(--sub); font-weight:500; font-size:.85rem; line-height:1.7}
.inp{width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; background:var(--card); outline:0; transition:.15s}
.inp:focus{border-color:var(--red); box-shadow:0 0 0 3px rgba(206,17,38,.16)}
textarea.inp{resize:vertical; min-height:68px}
/* login */
.login{max-width:520px; margin:42px auto 0; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:28px; box-shadow:0 20px 50px -26px rgba(126,10,25,.55)}
.login h2{margin:0 0 6px; font-size:1.5rem; font-weight:900}
.login p.lead{margin:0 0 22px; color:var(--sub); line-height:1.8}
.row2{display:grid; grid-template-columns:2fr 1fr; gap:12px}
.chk{display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:700}
.chk input{width:18px; height:18px; accent-color:var(--red)}
details.help{margin-top:18px; border-top:1px dashed var(--line); padding-top:14px}
details.help summary{cursor:pointer; font-weight:800; color:var(--red)}
details.help ol{margin:12px 0 0; padding-inline-start:22px; line-height:2; color:var(--sub)}
.demo{display:block; margin:16px auto 0; background:none; border:0; color:var(--sub); text-decoration:underline; cursor:pointer; font-weight:700}
.err{color:#C0182B; font-weight:700; font-size:.92rem; min-height:1.4em; margin:6px 0 0}
/* dashboard */
.bar{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:18px}
.bar .grow{flex:1; min-width:200px}
.pub{display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:14px; background:rgba(34,160,90,.12); border:1px solid rgba(34,160,90,.4); font-weight:700; margin-bottom:18px}
.pub[hidden]{display:none}
.pub .sp{flex:1}
.demobar{padding:10px 16px; border-radius:14px; background:rgba(245,184,0,.2); border:1px solid rgba(245,184,0,.6); font-weight:700; margin-bottom:18px; line-height:1.7}
.agrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px}
.ac{background:var(--card); border:1px solid var(--line); border-radius:20px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 14px 30px -22px rgba(126,10,25,.6)}
.th{position:relative; aspect-ratio:16/10; background:linear-gradient(135deg,var(--deep),var(--red)); overflow:hidden}
.th img{width:100%; height:100%; object-fit:cover; display:block}
.th .ph{position:absolute; inset:0; display:grid; place-items:center; color:rgba(255,255,255,.85); font-size:2.6rem; font-weight:900}
.th .st{position:absolute; top:10px; inset-inline-end:10px; display:flex; gap:6px; flex-wrap:wrap}
.tag{display:inline-flex; align-items:center; gap:4px; padding:3px 11px; border-radius:999px; font-size:.8rem; font-weight:900; background:rgba(0,0,0,.55); color:#fff}
.tag.new{background:linear-gradient(135deg,#FFD84D,#F59E0B); color:#4A2600}
.tag.upd{background:linear-gradient(135deg,#1FB5CC,#0B6F8A)}
.tag.soon{background:rgba(206,17,38,.9)}
.ab{padding:16px 18px 18px; display:flex; flex-direction:column; gap:10px; flex:1}
.ab h3{margin:0; font-size:1.12rem; font-weight:900; line-height:1.5}
.ab .by{margin:0; color:var(--sub); font-size:.92rem; min-height:1.4em}
.tg{display:flex; gap:6px; flex-wrap:wrap; min-height:1.8em}
.tg span{background:var(--soft); border-radius:999px; padding:2px 11px; font-size:.82rem; font-weight:700}
.ax{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:auto; padding-top:6px}
.th .tools{position:absolute; bottom:10px; inset-inline-start:10px; display:flex; gap:6px}
.th .tools .ib{width:34px; height:34px; background:rgba(20,5,8,.62); border-color:transparent; color:#fff; backdrop-filter:blur(4px)}
.th .tools .ib:hover:not(:disabled){background:var(--red)}
.empty{text-align:center; padding:60px 20px; color:var(--sub); font-weight:700; line-height:2}
/* modal */
.ov{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(20,5,8,.62)}
.ov.open{display:flex}
.sheet{width:min(720px,100%); max-height:min(92vh,900px); display:flex; flex-direction:column; background:var(--card); border-radius:22px; overflow:hidden; box-shadow:0 34px 80px rgba(0,0,0,.5)}
.sh-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 22px; border-bottom:1px solid var(--line)}
.sh-head h2{margin:0; font-size:1.2rem; font-weight:900}
.sh-body{overflow:auto; padding:8px 22px 6px}
.sh-body section{padding:16px 0 4px; border-bottom:1px dashed var(--line)}
.sh-body section:last-child{border-bottom:0}
.sh-body h3{margin:0 0 14px; font-size:1.02rem; font-weight:900; display:flex; align-items:center; gap:10px}
.sh-body h3 .n{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--red); color:#fff; font-size:.85rem}
.sh-body h3 small{color:var(--sub); font-weight:600; font-size:.82rem}
.sh-foot{padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); display:grid; gap:10px}
.sh-foot .acts{display:flex; gap:10px; justify-content:flex-start}
.sh-foot .err{min-height:0; margin:0}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.cc{display:inline-flex; align-items:center; gap:6px; padding:7px 15px; border-radius:999px; border:1.5px solid var(--line); background:transparent; cursor:pointer; font-weight:800; font-size:.92rem; transition:.15s}
.cc:hover{border-color:var(--red)}
.cc[aria-pressed="true"]{background:linear-gradient(135deg,var(--red),var(--deep)); color:#fff; border-color:transparent}
.addcat{display:flex; gap:8px; margin-top:10px}
.addcat .inp{padding:8px 12px}
.dz{border:2px dashed var(--line); border-radius:16px; padding:20px; text-align:center; transition:.15s; background:var(--soft)}
.dz.over{border-color:var(--red); background:rgba(206,17,38,.12)}
.dz .big{font-size:2rem; line-height:1}
.dz p{margin:8px 0 14px; color:var(--sub); font-weight:700}
.dz .btns{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.fsum{display:flex; align-items:center; gap:12px; margin-top:12px; padding:12px 14px; border-radius:14px; border:1.5px solid rgba(34,160,90,.5); background:rgba(34,160,90,.1); font-weight:700}
.fsum[hidden]{display:none}
.fsum .t{flex:1; line-height:1.7}
.fsum .t small{display:block; color:var(--sub); font-weight:600}
.cvr{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.cvp{width:200px; aspect-ratio:16/10; border-radius:14px; overflow:hidden; background:linear-gradient(135deg,var(--deep),var(--red)); display:grid; place-items:center; color:rgba(255,255,255,.7); font-weight:800; flex:none}
.cvp img{width:100%; height:100%; object-fit:cover}
.sw{position:relative; width:46px; height:26px; flex:none}
.sw input{position:absolute; inset:0; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; z-index:2}
.sw i{position:absolute; inset:0; border-radius:999px; background:rgba(128,128,128,.4); transition:.18s}
.sw i::after{content:""; position:absolute; top:3px; inset-inline-start:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.18s}
.sw input:checked+i{background:var(--red)}
.sw input:checked+i::after{inset-inline-start:23px}
.opt{display:flex; align-items:center; gap:12px; padding:6px 0 14px; font-weight:800}
.opt small{display:block; color:var(--sub); font-weight:500}
.disabled-sec{opacity:.45; pointer-events:none}
.prog{display:grid; gap:6px}
.prog[hidden]{display:none}
.prog .tx{font-weight:700; font-size:.92rem}
.prog .tr{height:8px; border-radius:99px; background:var(--soft); overflow:hidden}
.prog .tr i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--gold),var(--red)); transition:width .25s}
.cd{width:min(440px,100%); background:var(--card); border-radius:20px; padding:24px; box-shadow:0 34px 80px rgba(0,0,0,.5)}
.cd h3{margin:0 0 8px; font-size:1.2rem}
.cd p{margin:0 0 18px; color:var(--sub); line-height:1.8}
.cd .acts{display:flex; gap:10px}
.btn.red{background:var(--red); color:#fff}
#toast{position:fixed; bottom:calc(24px + env(safe-area-inset-bottom,0px)); left:50%; transform:translate(-50%,30px); background:#2B0A10; color:#fff; padding:12px 22px; border-radius:14px; font-weight:800; opacity:0; pointer-events:none; transition:.25s; z-index:80; max-width:92vw; text-align:center}
#toast.show{opacity:1; transform:translate(-50%,0)}
@media(max-width:560px){.row2{grid-template-columns:1fr}.wrap{padding:18px 14px}.sh-body,.sh-head,.sh-foot{padding-inline:16px}.cvp{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>⚙️ لوحة المشرف</h1>
  <span class="chip2" id="repoChip" hidden></span>
  <a class="btn light sm" href="index.html" id="siteLink">عرض الموقع</a>
  <button class="btn light sm" id="logout" type="button" hidden>خروج</button>
</div></header>
<main class="wrap" id="app"></main>

<div class="ov" id="ed"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edT">
  <div class="sh-head"><h2 id="edT">إضافة لعبة جديدة</h2><button class="ib" id="edX" type="button" aria-label="إغلاق">✕</button></div>
  <div class="sh-body">
    <section>
      <h3><span class="n">1</span>معلومات اللعبة</h3>
      <div class="field"><label for="fTitle">اسم اللعبة</label><input class="inp" id="fTitle" maxlength="80" placeholder="مثال: متاهة اللؤلؤ" autocomplete="off"></div>
      <div class="field"><label for="fBy">إعداد الطالبات</label><input class="inp" id="fBy" maxlength="120" placeholder="مثال: سارة التيتون · فاطمة سعيد" autocomplete="off"><small>افصلي بين الأسماء بنقطة وسط (·) أو فاصلة (،)</small></div>
      <div class="field"><label>نوع اللعبة <small>(يمكن اختيار أكثر من نوع)</small></label>
        <div class="chips" id="catSel"></div>
        <div class="addcat"><input class="inp" id="newCat" maxlength="24" placeholder="نوع جديد…" autocomplete="off"><button class="btn ghost sm" id="addCatBtn" type="button">＋ إضافة نوع</button></div>
      </div>
    </section>
    <section id="secFiles">
      <h3><span class="n">2</span>ملفات اللعبة <small id="filesHint"></small></h3>
      <div class="dz" id="dz">
        <div class="big">📦</div>
        <p>اسحبي ملف اللعبة هنا، أو اختاري من الأزرار</p>
        <div class="btns">
          <button class="btn ghost sm" id="bHtml" type="button">📄 ملف HTML</button>
          <button class="btn ghost sm" id="bDir" type="button">📁 مجلد اللعبة</button>
          <button class="btn ghost sm" id="bZip" type="button">🗜️ ملف ZIP</button>
        </div>
      </div>
      <div class="fsum" id="fSum" hidden><span aria-hidden="true">✅</span><div class="t" id="fSumT"></div><button class="ib" id="fClr" type="button" aria-label="إزالة الملفات">✕</button></div>
      <p class="err" id="fErr"></p>
      <input type="file" id="inHtml" accept=".html,.htm" hidden>
      <input type="file" id="inDir" webkitdirectory multiple hidden>
      <input type="file" id="inZip" accept=".zip,application/zip" hidden>
    </section>
    <section>
      <h3><span class="n">3</span>صورة الغلاف <small>اختياري</small></h3>
      <div class="cvr">
        <div class="cvp" id="cvp"><span>بدون غلاف</span></div>
        <div style="display:grid;gap:8px">
          <button class="btn ghost sm" id="bCover" type="button">🖼️ اختيار صورة</button>
          <button class="btn ghost sm" id="bCoverX" type="button" hidden>إزالة الصورة الجديدة</button>
          <small class="hint">تُقصّ تلقائياً بنسبة 16:10. أنسب لقطة شاشة من داخل اللعبة.</small>
        </div>
      </div>
      <input type="file" id="inCover" accept="image/*" hidden>
    </section>
    <section>
      <h3><span class="n">4</span>خيارات</h3>
      <label class="opt"><span class="sw"><input type="checkbox" id="oSoon"><i></i></span><span>قريباً<small>تظهر البطاقة بختم «قريباً» دون زر لعب</small></span></label>
      <label class="opt" id="oBadgeRow"><span class="sw"><input type="checkbox" id="oBadge" checked><i></i></span><span>إظهار شارة «تحديث»<small>تظهر على البطاقة لمدة 14 يوماً بعد التحديث</small></span></label>
      <div class="field"><label for="fNote">ملاحظة التحديث <small>(اختياري — تظهر عند مرور المؤشر على الشارة)</small></label><input class="inp" id="fNote" maxlength="80" placeholder="مثال: أضفنا مرحلة جديدة" autocomplete="off"></div>
    </section>
  </div>
  <div class="sh-foot">
    <div class="prog" id="prog" hidden><div class="tx" id="progT"></div><div class="tr"><i id="progB"></i></div></div>
    <p class="err" id="edErr"></p>
    <div class="acts"><button class="btn primary" id="edS" type="button">حفظ ونشر</button><button class="btn ghost" id="edC" type="button">إلغاء</button></div>
  </div>
</div></div>

<div class="ov" id="cf"><div class="cd" role="alertdialog" aria-modal="true" aria-labelledby="cfT">
  <h3 id="cfT"></h3><p id="cfP"></p>
  <div class="acts"><button class="btn red" id="cfOk" type="button">حذف نهائي</button><button class="btn ghost" id="cfNo" type="button">تراجع</button></div>
</div></div>
<div id="toast" role="status"></div>

<script src="vendor/jszip.min.js"></script>
<script>
"use strict";
(()=>{
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const API=window.__API_BASE||"https://api.github.com";
const SAMPLE=window.__SAMPLE_GAMES||null;
const BADGE_DAYS=14, MAX_TOTAL=80*1024*1024;
const THEME_OF={national:"pearl",puzzle:"maze",adventure:"tree",arcade:"race",quiz:"quiz"};
const DEFAULT_CATS=[{k:"national",t:"وطنية",i:"🏛️"},{k:"puzzle",t:"ألغاز وبازل",i:"🧩"},{k:"adventure",t:"مغامرات",i:"🏃"},{k:"arcade",t:"أركيد وسرعة",i:"⚡"},{k:"quiz",t:"معلومات ومسابقات",i:"🧠"}];
const JUNK=/(^|\/)(\.[^/]*|__MACOSX|Thumbs\.db|node_modules)(\/|$)/i;

/* ---------- utils ---------- */
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),3200);};
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
const toB64=u8=>{let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);};
const fromB64=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const slugify=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
const rnd=()=>Math.random().toString(36).slice(2,6);
const revId=()=>Date.now().toString(36);
const nowIso=()=>new Date().toISOString();
const encPath=p=>p.split("/").map(encodeURIComponent).join("/");
const pathOfUrl=u=>{try{return decodeURI(String(u||"").split("?")[0])}catch(e){return String(u||"").split("?")[0]}};
const uniqueId=(base,games)=>{let id=base||("game-"+rnd()),n=2;while(games.some(g=>g.id===id))id=(base||"game")+"-"+(n++);return id;};
const badgeKind=g=>{if(g.soon)return"";const a=Date.parse(g.added)||0,u=Date.parse(g.updated)||0,t=Math.max(a,u);if(!t||Date.now()-t>BADGE_DAYS*864e5)return"";return u&&(!a||u-a>864e5)?"upd":"new";};
const errMsg=e=>{
  if(e&&e.status===401)return"رمز GitHub غير صالح أو منتهي الصلاحية.";
  if(e&&e.status===403)return"لا تملك صلاحية الكتابة على المستودع. تأكدي أن الرمز يملك صلاحية Contents: Read and write.";
  if(e&&e.status===404)return"المستودع أو الفرع غير موجود، أو أن الرمز لا يشمل هذا المستودع.";
  if(e&&(e.status===409||e.status===422))return"حدث تعارض أثناء الحفظ، أعيدي المحاولة بعد لحظات.";
  if(e instanceof TypeError)return"تعذّر الاتصال بالإنترنت.";
  return (e&&e.message)||"حدث خطأ غير متوقع.";
};

/* ---------- storage of login ---------- */
const saved=()=>{try{return JSON.parse(localStorage.getItem("alnoor_admin")||sessionStorage.getItem("alnoor_admin")||"null")}catch(e){return null}};
const persist=(o,remember)=>{try{localStorage.removeItem("alnoor_admin");sessionStorage.removeItem("alnoor_admin");(remember?localStorage:sessionStorage).setItem("alnoor_admin",JSON.stringify(o))}catch(e){}};
const forget=()=>{try{localStorage.removeItem("alnoor_admin");sessionStorage.removeItem("alnoor_admin")}catch(e){}};
const guessRepo=()=>{const m=location.hostname.match(/^([^.]+)\.github\.io$/);if(!m)return"";const seg=location.pathname.split("/").filter(Boolean)[0];return seg&&!/\.html?$/i.test(seg)?m[1]+"/"+seg:m[1]+"/"+m[1]+".github.io";};

/* ---------- backends ---------- */
class GH{
  constructor(repo,branch,token){this.repo=repo;this.branch=branch;this.token=token;this.br=branch.split("/").map(encodeURIComponent).join("/");}
  async api(path,o={}){
    const r=await fetch(API+path,{method:o.method||"GET",cache:"no-store",
      headers:{Authorization:"Bearer "+this.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(o.body?{"Content-Type":"application/json"}:{})},
      body:o.body?JSON.stringify(o.body):undefined});
    if(!r.ok){let m="";try{m=(await r.json()).message}catch(e){}const e=new Error(m||r.statusText);e.status=r.status;throw e;}
    return r.status===204?null:r.json();
  }
  async verify(){const d=await this.api(`/repos/${this.repo}`);if(!(d.permissions&&d.permissions.push)){const e=new Error("no push");e.status=403;throw e;}return d;}
  async getText(path){try{const d=await this.api(`/repos/${this.repo}/contents/${encodeURI(path)}?ref=${encodeURIComponent(this.branch)}`);return d&&d.content?fromB64(d.content):null;}catch(e){if(e.status===404)return null;throw e;}}
  async commit({upserts,deletePaths=[],deletePrefixes=[],message},progress=()=>{}){
    const total=upserts.length,blobs=[],queue=upserts.map((u,i)=>[i,u]);let done=0;
    const worker=async()=>{for(;;){const n=queue.shift();if(!n)return;const [i,u]=n;
      const bytes=typeof u.data==="string"?new TextEncoder().encode(u.data):u.data;
      const r=await this.api(`/repos/${this.repo}/git/blobs`,{method:"POST",body:{content:toB64(bytes),encoding:"base64"}});
      blobs[i]={path:u.path,sha:r.sha};done++;progress(`رفع الملفات ${done} / ${total}`,.08+.72*done/total);}};
    await Promise.all([worker(),worker(),worker()]);
    for(let attempt=0;;attempt++){
      try{
        progress("إنشاء النسخة الجديدة على GitHub…",.86);
        const ref=await this.api(`/repos/${this.repo}/git/ref/heads/${this.br}`);
        const head=ref.object.sha,cm=await this.api(`/repos/${this.repo}/git/commits/${head}`),base=cm.tree.sha;
        let dels=[];
        if(deletePaths.length||deletePrefixes.length){
          const t=await this.api(`/repos/${this.repo}/git/trees/${base}?recursive=1`),keep=new Set(upserts.map(u=>u.path));
          dels=t.tree.filter(e=>e.type==="blob"&&!keep.has(e.path)&&(deletePaths.includes(e.path)||deletePrefixes.some(p=>e.path.startsWith(p))))
            .map(e=>({path:e.path,mode:"100644",type:"blob",sha:null}));
        }
        const tree=await this.api(`/repos/${this.repo}/git/trees`,{method:"POST",body:{base_tree:base,tree:[...blobs.map(b=>({path:b.path,mode:"100644",type:"blob",sha:b.sha})),...dels]}});
        const nc=await this.api(`/repos/${this.repo}/git/commits`,{method:"POST",body:{message,tree:tree.sha,parents:[head]}});
        await this.api(`/repos/${this.repo}/git/refs/heads/${this.br}`,{method:"PATCH",body:{sha:nc.sha,force:false}});
        progress("تم الرفع ✔",1);return;
      }catch(e){if((e.status===422||e.status===409)&&attempt<2)continue;throw e;}
    }
  }
}
class Demo{
  constructor(games){this.files=new Map([["games.json",games]]);this.demo=true;}
  async verify(){return{};}
  async getText(p){const v=this.files.get(p);return typeof v==="string"?v:null;}
  async commit({upserts,deletePaths=[],deletePrefixes=[],message},progress=()=>{}){
    for(let i=0;i<upserts.length;i++){progress(`رفع الملفات ${i+1} / ${upserts.length}`,.08+.8*(i+1)/upserts.length);await new Promise(r=>setTimeout(r,40));}
    const keep=new Set(upserts.map(u=>u.path));
    for(const p of [...this.files.keys()])if(!keep.has(p)&&(deletePaths.includes(p)||deletePrefixes.some(x=>p.startsWith(x))))this.files.delete(p);
    upserts.forEach(u=>this.files.set(u.path,u.data));progress("تم الرفع ✔",1);
  }
}

async function readZip(f){
  const err=$("#fErr");
  if(!window.JSZip){err.textContent="تعذّر تحميل أداة ZIP. استخدمي «مجلد اللعبة» بدلاً منها.";return;}
  err.textContent="جارٍ قراءة ملف ZIP…";
  try{
    const z=await JSZip.loadAsync(f),ents=[];z.forEach((p,en)=>{if(!en.dir)ents.push([p,en]);});
    if(!ents.length){err.textContent="ملف ZIP فارغ.";return;}
    let paths=ents.map(x=>x[0]);const first=paths[0].split("/")[0];
    const strip=paths.every(p=>p.includes("/")&&p.split("/")[0]===first);
    const items=[];
    for(const [p,en] of ents){const bytes=await en.async("uint8array");items.push({path:strip?p.split("/").slice(1).join("/"):p,size:bytes.length,read:async()=>bytes});}
    err.textContent="";await setFiles(items);
  }catch(e){err.textContent="تعذّرت قراءة ملف ZIP. تأكدي أنه غير تالف.";}
}

function renderCover(){
  const cvp=$("#cvp"),g=E.g;let src=E.coverURL;
  if(!src&&g&&g.img)src=localPrev[pathOfUrl(g.img)]||g.img+(g.rev?"?v="+encodeURIComponent(g.rev):"");
  cvp.innerHTML=src?`<img src="${esc(src)}" alt="">`:`<span>بدون غلاف</span>`;
  $("#bCoverX").hidden=!E.cover;
}
$("#bCover").onclick=()=>$("#inCover").click();
$("#bCoverX").onclick=()=>{if(E.coverURL)URL.revokeObjectURL(E.coverURL);E.cover=null;E.coverURL="";renderCover();};
$("#inCover").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const bmp=await createImageBitmap(f),W=1000,H=625,c=document.createElement("canvas");c.width=W;c.height=H;
    const r=Math.max(W/bmp.width,H/bmp.height),w=bmp.width*r,h=bmp.height*r,x=c.getContext("2d");
    x.fillStyle="#000";x.fillRect(0,0,W,H);x.drawImage(bmp,(W-w)/2,(H-h)/2,w,h);
    const blob=await new Promise(res=>c.toBlob(res,"image/jpeg",.86));
    if(E.coverURL)URL.revokeObjectURL(E.coverURL);
    E.cover=new Uint8Array(await blob.arrayBuffer());E.coverURL=URL.createObjectURL(blob);renderCover();
  }catch(err){toast("تعذّرت قراءة الصورة، جرّبي صورة أخرى.");}
};

/* save */
const setProg=(t,f)=>{$("#prog").hidden=false;$("#progT").textContent=t;$("#progB").style.width=Math.round((f||0)*100)+"%";};
$("#edX").onclick=()=>closeEditor();$("#edC").onclick=()=>closeEditor();
ed.addEventListener("mousedown",e=>{if(e.target===ed)closeEditor();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#cf").classList.contains("open"))$("#cf").classList.remove("open");else if(E)closeEditor();}});
$("#edS").onclick=async()=>{
  if(!E||E.busy)return;
  const title=$("#fTitle").value.trim(),by=$("#fBy").value.trim(),note=$("#fNote").value.trim(),soon=$("#oSoon").checked,badge=$("#oBadge").checked;
  const err=$("#edErr");err.textContent="";
  if(!title){err.textContent="اكتبي اسم اللعبة.";$("#fTitle").focus();return;}
  if(E.mode==="add"&&!soon&&!E.files){err.textContent="اختاري ملف اللعبة أو مجلدها، أو فعّلي «قريباً» لإضافة البطاقة بدونها.";$("#secFiles").scrollIntoView({block:"center"});return;}
  const files=!soon?E.files:null,cover=E.cover,tags=[...E.tags],newCats=E.newCats.filter(c=>E.tags.has(c.k)),mode=E.mode,gid=E.g&&E.g.id,entry=E.entry;
  E.busy=true;$("#edS").disabled=true;$("#edS").textContent="جارٍ الحفظ…";
  try{
    await publish(mode==="add"?`إضافة لعبة: ${title}`:`تحديث لعبة: ${title}`,async data=>{
      newCats.forEach(c=>{if(!data.categories.some(x=>x.k===c.k))data.categories.push(c);});
      const up=[],plan={upserts:up,deletePaths:[],deletePrefixes:[]};
      const readAll=async(id)=>{for(const f of files)up.push({path:`games/${id}/${f.path}`,data:await f.read()});return `games/${id}/${encPath(entry)}`;};
      const themeFor=()=>{for(const t of tags){if(THEME_OF[t])return THEME_OF[t];}return"space";};
      if(mode==="add"){
        const id=uniqueId(slugify(title),data.games),g={id,title,by,url:"",img:"",tags,theme:themeFor(),soon:!!soon,added:nowIso(),updated:"",rev:revId(),note};
        if(files){g.url=await readAll(id);g.soon=false;}
        if(cover){up.push({path:`assets/${id}.jpg`,data:cover});g.img=`assets/${id}.jpg`;localPrev[`assets/${id}.jpg`]=E.coverURL;}
        data.games.push(g);return plan;
      }
      const g=data.games.find(x=>x.id===gid);if(!g)throw new Error("اللعبة لم تعد موجودة في القائمة.");
      Object.assign(g,{title,by,tags,note,soon:!!soon});
      if(!g.theme)g.theme=themeFor();
      if(files){
        const dir=`games/${g.id}/`,old=pathOfUrl(g.url);
        g.url=await readAll(g.id);g.soon=false;g.rev=revId();
        plan.deletePrefixes.push(dir);
        if(old&&old.startsWith("games/")&&!old.startsWith(dir))plan.deletePaths.push(old);
        if(badge)g.updated=nowIso();
      }
      if(cover){up.push({path:`assets/${g.id}.jpg`,data:cover});g.img=`assets/${g.id}.jpg`;g.rev=revId();localPrev[`assets/${g.id}.jpg`]=E.coverURL;}
      return plan;
    },setProg);
    closeEditor(true);toast(mode==="add"?"تمت إضافة اللعبة ✔":"تم حفظ التعديلات ✔");
  }catch(e){err.textContent=errMsg(e);if(E){E.busy=false;$("#edS").disabled=false;$("#edS").textContent=mode==="add"?"حفظ ونشر":"حفظ التعديلات ونشرها";}$("#prog").hidden=true;}
};

/* ---------- boot ---------- */
(async()=>{
  if(window.__AUTO_DEMO){await startDemo();return;}
  const s=saved();
  if(s&&s.token&&s.repo){
    renderLogin();$("#lGo").disabled=true;$("#lGo").textContent="جارٍ الدخول…";
    try{const gh=new GH(s.repo,s.branch||"main",s.token);await gh.verify();B=gh;CFG=s;await loadData();renderDash();return;}
    catch(e){renderLogin(errMsg(e));return;}
  }
  renderLogin();
})();
})();
</script>
</body>
