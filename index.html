<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al Noor School Gaming Studio</title>
<meta name="description" content="معرض ألعاب طالبات مدرسة النور الثانوية للبنات — مملكة البحرين">
<meta property="og:title" content="Al Noor School Gaming Studio">
<meta property="og:description" content="معرض ألعاب طالبات مدرسة النور الثانوية للبنات — مملكة البحرين">
<meta property="og:image" content="assets/escape-the-fort.jpg">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#CE1126; --deep:#7E0A19; --gold:#F5B800;
  --bg:#FFF8F2; --card:#FFFFFF; --ink:#2B0A10; --sub:#7A4A52;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A0C10; --card:#2A141B; --ink:#FBEFF1; --sub:#D9A9B1;}}
:root[data-theme="dark"]{--bg:#1A0C10; --card:#2A141B; --ink:#FBEFF1; --sub:#D9A9B1;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Cairo',system-ui,sans-serif; overflow-x:hidden}

/* HERO */
.hero{position:relative; overflow:hidden; isolation:isolate; text-align:center; color:#fff;
  padding:74px 20px 110px; background:radial-gradient(circle at 18% 15%,#F0324A 0%,var(--red) 38%,var(--deep) 100%)}
.zig{position:absolute; left:0; right:0; bottom:-1px; height:26px;
  background:linear-gradient(135deg,var(--bg) 25%,transparent 25%) -26px 0/52px 52px,linear-gradient(225deg,var(--bg) 25%,transparent 25%) -26px 0/52px 52px}
.float{position:absolute; z-index:-1; opacity:.22; background:#fff; animation:drift 9s ease-in-out infinite}
.f1{width:38px;height:38px;top:14%;inset-inline-start:8%}
.f2{width:22px;height:22px;border-radius:50%;top:62%;inset-inline-start:14%;animation-delay:-3s}
.f3{width:0;height:0;background:none;border:22px solid transparent;border-bottom:38px solid #fff;top:20%;inset-inline-end:10%;animation-delay:-5s}
.f4{width:30px;height:30px;top:66%;inset-inline-end:16%;transform:rotate(45deg);animation-delay:-2s}
.f5{width:16px;height:16px;border-radius:50%;background:var(--gold);top:38%;inset-inline-end:5%;opacity:.5;animation-delay:-6s}
.f6{width:20px;height:20px;background:var(--gold);top:44%;inset-inline-start:4%;opacity:.45;animation-delay:-4s}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(90deg)}}
.tag{display:inline-block; padding:7px 20px; border-radius:999px; background:rgba(255,255,255,.16); border:1.5px solid rgba(255,255,255,.5);
  font-weight:700; letter-spacing:.3px; animation:drop .8s cubic-bezier(.2,.8,.2,1) both}
.logo{direction:ltr; margin:22px 0 14px; font-family:'Bungee',Impact,sans-serif; font-weight:400; line-height:1.08;
  font-size:clamp(2.1rem,7.2vw,5.4rem); text-shadow:0 5px 0 var(--deep),0 12px 24px rgba(0,0,0,.35)}
.logo .w{display:block; white-space:nowrap}
.logo .w:nth-child(3){color:var(--gold)}
.logo .l{display:inline-block; animation:pop .7s cubic-bezier(.2,1.4,.4,1) both; animation-delay:calc(var(--i)*.045s + .3s); cursor:default}
.logo .l:hover{animation:jig .5s ease}
@keyframes pop{from{opacity:0; transform:translateY(40px) scale(.4) rotate(-14deg)}}
@keyframes jig{40%{transform:translateY(-14px) rotate(8deg) scale(1.15)}}
@keyframes drop{from{opacity:0; transform:translateY(-20px)}}
@keyframes rise{from{opacity:0; transform:translateY(24px)}}
.sub{margin:0 auto; max-width:640px; font-size:clamp(1.05rem,2.4vw,1.4rem); font-weight:500; opacity:.95; animation:rise .9s ease 1.5s both}
.cta{display:inline-flex; align-items:center; gap:10px; margin-top:28px; padding:14px 34px; border-radius:999px; text-decoration:none;
  background:#fff; color:var(--red); font-weight:900; font-size:1.1rem; box-shadow:0 12px 26px -10px rgba(0,0,0,.5);
  animation:rise .9s ease 1.8s both; transition:.2s}
.cta:hover{transform:translateY(-4px) scale(1.05); background:var(--gold); color:var(--ink)}
.cta svg{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}

/* GALLERY */
main{max-width:1180px; margin:0 auto; padding:56px 20px 40px}
.head{text-align:center; margin-bottom:40px}
.head h2{display:inline-block; position:relative; margin:0; font-size:clamp(1.8rem,4.5vw,2.8rem); font-weight:900}
.head h2::after{content:""; display:block; height:6px; width:0; margin:8px auto 0; border-radius:6px;
  background:linear-gradient(90deg,var(--red),var(--gold)); transition:width 1s ease .3s}
.head.in h2::after{width:100%}
.count{margin-top:12px; color:var(--sub); font-weight:700}
.count b{color:var(--red); font-size:1.5rem}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:30px}
.wrap{opacity:0; transform:translateY(46px); transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1); transition-delay:calc(var(--i)*.09s)}
.wrap.in{opacity:1; transform:none}
.card{background:var(--card); border-radius:22px; overflow:hidden; border:1px solid rgba(206,17,38,.14);
  box-shadow:0 14px 34px -16px rgba(126,10,25,.5); transition:transform .18s ease,box-shadow .25s; will-change:transform}
.card:hover{box-shadow:0 26px 46px -16px rgba(206,17,38,.55)}
.art{position:relative; aspect-ratio:16/10; overflow:hidden; background:var(--deep)}
.art svg{display:block; width:100%; height:100%; transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.card:hover .art svg{transform:scale(1.12) rotate(.6deg)}
.art::after{content:""; position:absolute; top:0; bottom:0; width:45%; inset-inline-start:-70%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent); transform:skewX(-18deg); transition:inset-inline-start .8s ease}
.card:hover .art::after{inset-inline-start:130%}
.num{position:absolute; z-index:2; top:12px; inset-inline-start:12px; padding:4px 12px; border-radius:999px;
  background:var(--red); color:#fff; font-family:'Bungee',sans-serif; font-size:.85rem; box-shadow:0 4px 10px rgba(0,0,0,.3)}
.body{padding:18px 20px 22px; text-align:center}
.body h3{margin:0 0 10px; font-size:1.5rem; font-weight:900; position:relative; display:inline-block}
.body h3::after{content:""; position:absolute; bottom:-4px; inset-inline:50%; height:3px; background:var(--red); border-radius:3px; transition:.35s}
.card:hover h3::after{inset-inline:0}
.by{margin:0 0 18px; color:var(--sub); font-weight:500; line-height:1.7}
.by b{color:var(--red); font-weight:900}
.play{position:relative; display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:13px;
  border:0; border-radius:14px; cursor:pointer; color:#fff; font-family:inherit; font-size:1.15rem; font-weight:900; letter-spacing:.5px;
  background:linear-gradient(135deg,#E8283D,var(--red) 55%,var(--deep)); box-shadow:0 10px 20px -10px var(--red); transition:.2s; overflow:hidden}
.play svg{transition:transform .25s}
.play:hover{background:linear-gradient(135deg,var(--gold),#FFD85A); color:var(--ink); transform:translateY(-2px)}
.play:hover svg{transform:translateX(-6px) scale(1.2)}
.play::before{content:""; position:absolute; inset:0; border-radius:14px; box-shadow:0 0 0 0 rgba(206,17,38,.55); animation:ring 2.2s ease-out infinite}
@keyframes ring{to{box-shadow:0 0 0 14px rgba(206,17,38,0)}}

/* FOOTER */
footer{position:relative; margin-top:50px; padding:54px 20px 30px; text-align:center; color:#fff; background:linear-gradient(160deg,var(--red),var(--deep))}
footer .zig{top:-1px; bottom:auto; transform:rotate(180deg)}
footer b{font-family:'Bungee',sans-serif; font-weight:400; letter-spacing:.5px; display:block; margin-bottom:6px; direction:ltr}
.stamp{position:absolute; top:50%; left:50%; z-index:3; transform:translate(-50%,-50%) rotate(-12deg); padding:6px 26px 8px;
  border:4px solid #fff; border-radius:12px; outline:2px dashed rgba(255,255,255,.65); outline-offset:4px;
  background:rgba(206,17,38,.88); opacity:.65; color:#fff; font-weight:900; font-size:clamp(28px,5vw,40px); line-height:1.3;
  box-shadow:0 10px 28px rgba(0,0,0,.4); pointer-events:none; white-space:nowrap}
.card.soon .art svg,.card.soon .art img{filter:saturate(.7) brightness(.8)}
.card.soon h3{margin-bottom:18px}
.play[disabled],.play[disabled]:hover{cursor:default; background:#E4DCD6; color:#8A7B72; box-shadow:none; transform:none}
.play[disabled]::before{display:none}
.play[disabled] svg{display:none}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,120px); z-index:20;
  background:var(--ink); color:var(--bg); padding:12px 24px; border-radius:999px; font-weight:700; transition:transform .4s cubic-bezier(.2,1.2,.4,1); max-width:90vw; text-align:center}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important; transition:none !important} .wrap{opacity:1; transform:none}}
</style>
</head>
<body>

<header class="hero">
  <span class="float f1"></span><span class="float f2"></span><span class="float f3"></span>
  <span class="float f4"></span><span class="float f5"></span><span class="float f6"></span>
  <span class="tag">مملكة البحرين · مدرسة النور الثانوية للبنات</span>
  <h1 class="logo" id="logo" aria-label="Al Noor School Gaming Studio"></h1>
  <p class="sub">ألعاب صمّمتها وبرمجتها طالباتنا المبدعات — العبي، استمتعي، وتفاخري بإبداعهن!</p>
  <a class="cta" href="#games">شاهدي الألعاب
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </a>
  <div class="zig"></div>
</header>

<main id="games">
  <div class="head" id="head">
    <h2>معرض الألعاب</h2>
    <div class="count">عدد الألعاب: <b id="cnt">0</b></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="zig"></div>
  <b>Al Noor School Gaming Studio</b>
  مدرسة النور الثانوية للبنات — مملكة البحرين
</footer>
<div class="toast" id="toast"></div>

<script>
/* ===== عدّلي هنا: أضيفي ألعابكم الحقيقية =====
   title: اسم اللعبة | by: أسماء الطالبات | url: رابط اللعبة | img: رابط/صورة اختيارية (بدلها يظهر رسم تلقائي) */
const GAMES = [
  {title:"Pearls of Bahrain",   by:"سارة التيتون", url:"games/pearls-of-bahrain.html", img:"assets/pearls-of-bahrain.jpg", theme:"pearl"},
  {title:"دروب الأفق",          by:"جمان حسين محمد", url:"games/horizon-paths.html", img:"assets/horizon-paths.jpg", theme:"race"},
  {title:"الهروب من القلعة",     by:"فاطمة سعيد جعفر", url:"games/escape-the-fort.html", theme:"fort", img:"assets/escape-the-fort.jpg"},
  {title:"سودوكو اللؤلؤ",        by:"زهراء علي المختار · رقية حسين الحايكي", url:"games/pearl-sudoku.html", img:"assets/pearl-sudoku.jpg", theme:"space"},
  {title:"من سيربح المليون؟ – النسخة البحرينية", by:"أطياب منصور", url:"games/who-wants-to-be-a-millionaire.html", img:"assets/who-wants-to-be-a-millionaire.jpg", theme:"maze"},
  {title:"المحقق الصغير",       by:"زهراء علي المختار · رقية حسين الحايكي", url:"games/little-detective.html", img:"assets/little-detective.jpg", theme:"tree"},
  {title:"برق الثعلب",          by:"طالبة 3فيز1", url:"games/fox-lightning.html", img:"assets/fox-lightning.jpg", theme:"falcon"},
  {title:"Spark's Adventure",    by:"", soon:true, url:"", img:"assets/sparks-adventure.jpg", theme:"quiz"},
  {title:"أرض دلمون",           by:"زينب", url:"games/dilmun-land.html", img:"assets/dilmun-land.jpg", theme:"pearl"},
  {title:"سفينة دلمون",         by:"", soon:true, url:"", theme:"ship"},
  {title:"حديقة النور",         by:"", soon:true, url:"", theme:"garden"}
];

/* ---- generated cover art (used when no img is given) ---- */
const rnd=(s=>()=>(s=(s*9301+49297)%233280)/233280);
const dots=(n,seed,f)=>{const r=rnd(seed);let o="";for(let i=0;i<n;i++)o+=f(r()*320,r()*200,r());return o;};
const THEMES={
  pearl:["#1AA7C7","#0B3B66",()=>dots(18,3,(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${2+r*6}" fill="#fff" opacity=".35"/>`)+
    `<path d="M0 170Q80 140 160 168T320 160V200H0Z" fill="#F2D49B"/><path d="M110 168a50 40 0 0 1 100 0z" fill="#F7E7C6"/><path d="M118 168a42 34 0 0 1 84 0" fill="none" stroke="#D9B26A" stroke-width="3"/><circle cx="160" cy="132" r="18" fill="#fff"/><circle cx="154" cy="126" r="6" fill="#fff" opacity=".9"/><circle cx="160" cy="132" r="18" fill="none" stroke="#CFE9F3" stroke-width="2"/>`],
  race:["#7CD3F7","#FDE7C8",()=>`<circle cx="250" cy="55" r="26" fill="#FFD447"/><path d="M0 120L60 70 120 120 190 60 260 120 320 90V140H0Z" fill="#C9A26B"/><path d="M0 200V128H320V200Z" fill="#8FBF6B"/><path d="M95 200L142 118H178L225 200Z" fill="#33333D"/><path d="M160 122v10m0 14v14m0 20v20" stroke="#fff" stroke-width="4"/><rect x="132" y="150" width="56" height="30" rx="10" fill="#CE1126"/><rect x="142" y="140" width="36" height="18" rx="7" fill="#fff"/><circle cx="142" cy="182" r="7" fill="#111"/><circle cx="178" cy="182" r="7" fill="#111"/>`],
  fort:["#FFB25B","#FFE9B8",()=>`<circle cx="70" cy="60" r="30" fill="#FFF3B0"/><path d="M0 170Q100 130 200 165T320 150V200H0Z" fill="#E8B96A"/><path d="M90 170V100h20V88h20v12h20V88h20v12h20v70z" fill="#B87B45"/><path d="M148 170v-30a12 12 0 0 1 24 0v30z" fill="#4B2A18"/><path d="M270 168c0-30 4-52 10-70" stroke="#6B4423" stroke-width="7" fill="none"/><path d="M280 98q-25-14-38 6m38-6q24-16 40 4m-40-4q-6-26 8-34m-8 34q10-24 30-24" stroke="#2E8B57" stroke-width="6" fill="none"/>`],
  space:["#1B1550","#4A1E7A",()=>dots(40,7,(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${.6+r*1.6}" fill="#fff" opacity="${.5+r*.5}"/>`)+
    `<circle cx="80" cy="130" r="42" fill="#CE1126"/><ellipse cx="80" cy="130" rx="66" ry="12" fill="none" stroke="#F5B800" stroke-width="5" transform="rotate(-18 80 130)"/><g transform="rotate(35 225 90)"><path d="M225 40q22 30 16 78h-32q-6-48 16-78z" fill="#fff"/><circle cx="225" cy="80" r="9" fill="#1AA7C7"/><path d="M209 112l-14 20 18-6zM241 112l14 20-18-6z" fill="#CE1126"/><path d="M216 120q9 26 18 0z" fill="#F5B800"/></g>`],
  maze:["#5B2A86","#2B1050",()=>`<path d="M30 30H290V170H30V60H260V140H60V90H230V110H90" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".85"/><path d="M30 30H290V170H30V60H260V140H60V90H230V110H90" fill="none" stroke="#F5B800" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/><circle cx="90" cy="110" r="12" fill="#CE1126"/><circle cx="90" cy="110" r="5" fill="#fff"/>`],
  tree:["#F58B5B","#FFD9A0",()=>`<circle cx="245" cy="62" r="34" fill="#FFF3B0"/><path d="M0 172Q90 138 180 168T320 158V200H0Z" fill="#D69B57"/><path d="M150 176V120q-4-18 10-32 14 14 10 32v56z" fill="#6B4423"/><g fill="#2E8B57"><circle cx="160" cy="72" r="34"/><circle cx="130" cy="92" r="24"/><circle cx="192" cy="92" r="24"/></g>`+dots(9,5,(x,y,r)=>`<circle cx="${110+r*100}" cy="${50+((x*7)%60)}" r="3.5" fill="#F5B800"/>`)],
  falcon:["#D98A3D","#4A2C14",()=>dots(12,19,(x,y,r)=>`<circle cx="${x}" cy="${y*.4+8}" r="${1+r*2}" fill="#FFE9B8" opacity=".5"/>`)+
    `<circle cx="250" cy="46" r="28" fill="#FFD447"/><path d="M0 150Q90 118 180 146T320 130V200H0Z" fill="#C9975A"/><path d="M0 200V158Q160 182 320 152V200Z" fill="#8B5A2B"/><path d="M110 74q30-22 50 0q-25 10-50 16q-25-6-50-16q20-22 50 0Z" fill="#2B1810"/><path d="M160 74l-5 18 5 9 5-9z" fill="#2B1810"/>`],
  quiz:["#6B2D5C","#2B0F3A",()=>dots(22,13,(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${.6+r*1.4}" fill="#fff" opacity="${.3+r*.4}"/>`)+
    `<rect x="95" y="46" width="130" height="104" rx="12" fill="#fff" opacity=".94"/><rect x="95" y="46" width="130" height="20" rx="10" fill="#F5B800"/><text x="160" y="120" font-family="Georgia,'Times New Roman',serif" font-size="60" font-weight="900" fill="#6B2D5C" text-anchor="middle">؟</text>`],
  ship:["#0B4F6C","#07323F",()=>`<circle cx="62" cy="48" r="22" fill="#FFE9A8" opacity=".92"/><path d="M0 150Q160 120 320 150V200H0Z" fill="#0E6B8C"/><path d="M40 150Q160 130 280 150L255 175H65Z" fill="#8B5A2B"/><path d="M160 150V70" stroke="#6B4423" stroke-width="4"/><path d="M162 75q50 10 55 55l-55-8z" fill="#F5F0E6"/><path d="M158 78q-45 14-48 58l48-10z" fill="#F5F0E6"/>`],
  garden:["#2E8B57","#145A32",()=>`<circle cx="255" cy="48" r="26" fill="#FFF3B0"/><path d="M0 170Q100 140 200 165T320 155V200H0Z" fill="#6BAE75"/>`+
    dots(9,21,(x,y,r)=>`<g transform="translate(${20+(x%280)},${150+(y%40)})"><circle r="6" fill="#F5B800"/><circle cx="8" r="5" fill="#CE1126" opacity=".9"/></g>`)+
    `<path d="M160 170V112" stroke="#145A32" stroke-width="5"/><circle cx="160" cy="96" r="26" fill="#2E8B57"/><circle cx="135" cy="112" r="18" fill="#2E8B57"/><circle cx="185" cy="112" r="18" fill="#2E8B57"/>`]
};
const cover=(t,i)=>{const [a,b,f]=THEMES[t]||THEMES.pearl;
  return `<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true"><defs><linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="320" height="200" fill="url(#g${i})"/>${f()}</svg>`;};

/* ---- render ---- */
const $=s=>document.querySelector(s);
$("#logo").innerHTML=["Al Noor","School","Gaming Studio"].map((w,wi)=>{
  let n=[0,6,12][wi];
  return `<span class="w">${[...w].map(c=>`<span class="l" style="--i:${n++}">${c===" "?"&nbsp;":c}</span>`).join("")}</span>`;
}).join("");

$("#grid").innerHTML=GAMES.map((g,i)=>`
  <div class="wrap" style="--i:${i}"><article class="card${g.soon?' soon':''}">
    <div class="art"><span class="num">#${String(i+1).padStart(2,"0")}</span>${g.soon?'<span class="stamp">قريباً</span>':""}${g.img?`<img src="${g.img}" alt="${g.title}" style="width:100%;height:100%;object-fit:cover">`:cover(g.theme,i)}</div>
    <div class="body">
      <h3>${g.title}</h3>
      ${g.by?`<p class="by"><b>${/[·،&]/.test(g.by)?"إعداد الطالبات":"إعداد الطالبة"}:</b><br>${g.by}</p>`:""}
      <button class="play" type="button" data-i="${i}"${g.soon?" disabled":""}>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>${g.soon?"قريباً":"PLAY"}
      </button>
    </div></article></div>`).join("");

/* ---- interactions ---- */
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2600);};
document.addEventListener("click",e=>{
  const b=e.target.closest(".play"); if(!b||b.disabled) return;
  const g=GAMES[b.dataset.i];
  g.url ? window.open(g.url,"_blank","noopener") : toast("رابط لعبة «"+g.title+"» سيُضاف قريباً 🎮");
});
document.querySelectorAll(".card").forEach(c=>{
  c.addEventListener("mousemove",e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    c.style.transform=`perspective(800px) rotateY(${x*9}deg) rotateX(${-y*9}deg) translateY(-6px)`;});
  c.addEventListener("mouseleave",()=>c.style.transform="");
});
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return; e.target.classList.add("in"); io.unobserve(e.target);
  if(e.target.id==="head"){const n=GAMES.length,t0=performance.now();
    const step=t=>{const p=Math.min((t-t0)/900,1);$("#cnt").textContent=Math.round(p*n);if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}
}),{threshold:.18});
document.querySelectorAll(".wrap,#head").forEach(el=>io.observe(el));
</script>
</body>
</html>
