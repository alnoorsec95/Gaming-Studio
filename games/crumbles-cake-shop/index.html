<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crumbles - Cake Shop Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Lalezar&family=Nunito:wght@600;800&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#BFE6D6; --on-bg:#3A2024; --sh:#3A2024;
  --ink:#3A2024; --card:#ffffff; --muted:#7A5E62;
  --berry:#E23D6B; --butter:#FFD966; --mint:#7CCBA9; --blue:#5B63D9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12302A; --on-bg:#F7EBE3; --sh:#06110E; }
}
:root[data-theme="dark"]{ --bg:#12302A; --on-bg:#F7EBE3; --sh:#06110E; }
*,*::before,*::after{ box-sizing:inherit; }
[hidden]{ display:none !important; }
html{ height:100%; overflow:hidden; }
body{
  margin:0; height:100%; position:relative; overflow:hidden;
  padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px);
  background-color:var(--bg);
  background-image:radial-gradient(rgba(0,0,0,.07) 2px, transparent 2.5px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:'Nunito','Tajawal',Tahoma,system-ui,sans-serif;
  font-size:17px; line-height:1.5;
}
h1,h2,h3,h4{ font-family:'Fredoka','Lalezar','Tajawal',Tahoma,sans-serif; font-weight:400; margin:0; line-height:1.2; }
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3,html[lang="en"] h4,html[lang="en"] .btn,html[lang="en"] .brand,html[lang="en"] .logo{ font-weight:600; }
p{ margin:0; }

/* the game canvas: a fixed design size that JS scales to fit the screen */
#app{ position:absolute; left:0; top:0; transform-origin:0 0; overflow:hidden; }
.appRoot{ position:absolute; inset:0; display:flex; flex-direction:column; }
.wrap{ flex:1; min-height:0; display:flex; flex-direction:column; padding:0 14px 12px; }
.port .wrap{ padding:0 10px 8px; }

/* awning + shop decor */
.awning{ flex:none; display:flex; height:34px; overflow:hidden; margin-bottom:6px; }
.awning i{ flex:1; background:var(--berry); border:3px solid var(--ink); border-top:0; border-radius:0 0 999px 999px / 0 0 26px 26px; margin-inline:-1.5px; height:30px; }
.awning i:nth-child(even){ background:#fff; }
.awning.rainbow i:nth-child(6n+1){ background:#FF6B6B; } .awning.rainbow i:nth-child(6n+2){ background:#FFB84D; }
.awning.rainbow i:nth-child(6n+3){ background:#FFE066; } .awning.rainbow i:nth-child(6n+4){ background:#7CCBA9; }
.awning.rainbow i:nth-child(6n+5){ background:#6DB7FF; } .awning.rainbow i:nth-child(6n+6){ background:#B58CFF; }
.decorStrip{ flex:none; display:flex; flex-direction:column; overflow:hidden; width:100%; }
.decorStrip svg{ display:block; width:100%; }

/* hud */
.hud{ flex:none; display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
.hudL{ display:flex; align-items:center; gap:8px; }
.brand{ font-family:'Fredoka','Lalezar',sans-serif; font-size:1.7rem; color:var(--on-bg); line-height:1; }
.port .brand{ display:none; }
.port #homeBtn .btxt{ display:none; }
.pills{ display:flex; gap:6px; }
.pill{ display:inline-flex; align-items:center; gap:6px; background:var(--card); border:3px solid var(--ink); border-radius:999px; padding:0 12px; font-weight:800; font-size:.95rem; line-height:1.65; box-shadow:2px 2px 0 var(--sh); white-space:nowrap; }
.port .pill{ padding:0 8px; font-size:.8rem; gap:4px; }
.port .pills{ gap:4px; }
.port .pills .pill:first-child{ display:none; }
.steps{ flex:none; display:flex; gap:6px; list-style:none; margin:0 0 8px; padding:0; }
.steps li{ flex:1; text-align:center; padding:1px 4px; border:3px solid var(--ink); border-radius:12px; background:var(--card); opacity:.6; font-weight:800; font-size:.9rem; line-height:1.5; white-space:nowrap; }
.steps li b{ display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--ink); color:#fff; font-size:.75rem; margin-inline-end:4px; }
.steps li.on{ background:var(--butter); opacity:1; box-shadow:2px 2px 0 var(--sh); }
.steps li.done{ background:var(--mint); opacity:1; }
.port .steps{ gap:4px; } .port .steps li{ font-size:.7rem; padding:0 2px; } .port .steps li b{ display:none; }

/* cards + board */
.card{ background:var(--card); border:3px solid var(--ink); border-radius:22px; box-shadow:5px 5px 0 var(--sh); padding:14px; }
.port .card{ padding:10px; border-radius:18px; box-shadow:3px 3px 0 var(--sh); }
.board{ flex:1; min-height:0; display:grid; gap:12px; grid-template-columns:250px minmax(0,1fr); grid-template-rows:minmax(0,1fr); }
.board > *{ min-height:0; min-width:0; }
.port .board{ grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); gap:8px; }
.board.solo{ grid-template-columns:minmax(0,1fr); }
.port .board.solo{ grid-template-rows:minmax(0,1fr); }
.board.solo .client{ display:none; }

/* customer card */
.client{ display:flex; flex-direction:column; gap:6px; overflow:hidden; }
.face{ flex:none; width:84px; margin:0 auto; animation:pop .45s cubic-bezier(.3,1.6,.5,1); }
.custSvg{ width:100%; height:auto; display:block; }
.cinfo{ display:flex; flex-direction:column; gap:4px; }
.cname{ font-size:1.5rem; text-align:center; }
.ticket{ background:#FFF4CC; border:2.5px dashed var(--ink); border-radius:14px; padding:8px 10px; display:grid; gap:5px; }
.trow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.tl{ min-width:58px; font-weight:800; color:var(--muted); font-size:.88rem; }
.tops{ display:flex; gap:5px; flex-wrap:wrap; }
.chip{ display:inline-flex; align-items:center; gap:6px; background:#fff; border:2px solid var(--ink); border-radius:999px; padding:0 10px; font-weight:700; font-size:.92rem; line-height:1.8; }
.dot{ width:14px; height:14px; border-radius:50%; border:2px solid var(--ink); display:inline-block; }
.patience{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:.85rem; color:var(--muted); }
.pbarTrack{ flex:1; height:12px; border:2.5px solid var(--ink); border-radius:999px; background:#fff; overflow:hidden; }
.pbarTrack i{ display:block; height:100%; width:100%; background:var(--mint); transition:width .25s linear; }
.port .client{ display:grid; grid-template-columns:56px 1fr; grid-template-areas:"face info" "ticket ticket"; gap:4px 10px; align-items:center; }
.port .face{ grid-area:face; width:56px; margin:0; }
.port .cinfo{ grid-area:info; gap:2px; }
.port .ticketWrap{ grid-area:ticket; }
.port .cname{ font-size:1.1rem; text-align:start; }
.port .ticket{ display:flex; flex-wrap:wrap; gap:4px; padding:5px 7px; }
.port .trow{ display:contents; } .port .tl{ display:none; } .port .tops{ display:contents; }
.port .chip{ font-size:.78rem; padding:0 7px; line-height:1.6; }

/* station */
.station{ display:flex; flex-direction:column; min-height:0; overflow:hidden; padding:14px; }
.station h3{ flex:none; font-size:1.5rem; }
.port .station > h3{ display:none; }
.sub{ flex:none; color:var(--muted); margin:0 0 6px; font-size:.95rem; line-height:1.35; }
.port .sub{ font-size:.82rem; margin-bottom:4px; }
.station > .stageSvg{ flex:1 1 0; min-height:50px; width:100%; max-width:440px; height:auto; margin:2px auto; display:block; }
.swrow{ display:flex; flex-wrap:wrap; gap:6px; margin:4px 0; }
.sw{ position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 9px; min-width:70px; background:#fff; border:3px solid var(--ink); border-radius:14px; cursor:pointer; font:inherit; font-size:.9rem; font-weight:700; color:var(--ink); touch-action:manipulation; line-height:1.2; }
.sw .col{ width:26px; height:26px; border-radius:50%; border:3px solid var(--ink); }
.sw.sel{ background:var(--butter); box-shadow:2px 2px 0 var(--sh); transform:translateY(-2px); }
.sw .n{ position:absolute; top:-8px; inset-inline-start:-8px; min-width:20px; height:20px; border-radius:10px; background:var(--berry); color:#fff; border:2px solid var(--ink); font-size:.75rem; font-weight:800; display:grid; place-items:center; padding:0 4px; font-style:normal; }
.port .sw{ min-width:0; padding:3px 5px; border-radius:12px; } .port .sw .lbl{ display:none; } .port .sw .col{ width:22px; height:22px; }
.port #flRow .sw{ padding:5px 8px; font-size:.8rem; }
.actions{ flex:none; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:6px 0 0; }
.verdict{ flex:none; min-height:1.5em; text-align:center; font-weight:800; margin:2px 0; font-size:.95rem; }

.btn{ font-family:'Fredoka','Lalezar','Tajawal',sans-serif; font-size:1.1rem; line-height:1.2; background:var(--berry); color:#fff; border:3px solid var(--ink); border-radius:16px; padding:.4em 1.1em; cursor:pointer; box-shadow:0 4px 0 var(--ink); transition:transform .08s, box-shadow .08s; touch-action:manipulation; margin:0 0 4px; }
.btn:active:not(:disabled){ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn.alt{ background:var(--butter); color:var(--ink); }
.btn.big{ font-size:1.35rem; padding:.4em 1.4em; }
.btn.sm{ font-size:.95rem; padding:.25em .8em; box-shadow:0 3px 0 var(--ink); }
.port .btn.big{ font-size:1.2rem; padding:.35em 1.1em; }
.btn.hold{ touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
.btn.hold.on{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); background:#C72B57; }
.homeBtn{ display:inline-flex; align-items:center; gap:6px; margin:0; }
:focus-visible{ outline:4px solid var(--blue); outline-offset:3px; }

/* order stage */
.orderScene{ flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; }
.orderScene .bigFace{ width:150px; flex:none; }
.orderScene .oname{ display:block !important; font-size:1.7rem; }
.orderScene .bubble{ max-width:560px; margin:10px 0 6px; font-size:1.15rem; }
.orderScene .bubble::after{ inset-inline-end:auto; inset-inline-start:calc(50% - 11px); }
.port .orderScene .bigFace{ width:120px; }
.port .orderScene .bubble{ font-size:1rem; padding:12px 14px; }
.bubble{ position:relative; background:#FFF4CC; border:3px solid var(--ink); border-radius:20px; padding:14px 18px; font-weight:700; }
.bubble::after{ content:""; position:absolute; top:-12px; inset-inline-end:44px; width:20px; height:20px; background:#FFF4CC; border-top:3px solid var(--ink); border-inline-start:3px solid var(--ink); transform:rotate(45deg); }

/* gauge + oven */
.gauge{ flex:none; position:relative; height:30px; background:#fff; border:3px solid var(--ink); border-radius:999px; overflow:hidden; margin:8px 0 2px; }
.gauge .zone{ position:absolute; top:0; bottom:0; background:var(--mint); border-inline:3px solid var(--ink); }
.gauge .needle{ position:absolute; top:-2px; bottom:-2px; width:9px; border-radius:5px; background:var(--berry); border:2px solid var(--ink); margin-inline-start:-4px; inset-inline-start:0; }
.gl{ flex:none; display:flex; justify-content:space-between; font-weight:700; font-size:.85rem; color:var(--muted); padding:0 6px; }
.glow{ animation:glow 1.2s ease-in-out infinite alternate; }
@keyframes glow{ from{ opacity:.55; } to{ opacity:1; } }
.smoke circle{ animation:rise 1.4s ease-out infinite; transform-box:fill-box; transform-origin:center; }
.smoke circle:nth-child(2){ animation-delay:.4s; } .smoke circle:nth-child(3){ animation-delay:.8s; }
@keyframes rise{ 0%{ transform:translateY(8px) scale(.6); opacity:.9; } 100%{ transform:translateY(-26px) scale(1.5); opacity:0; } }

/* decorate */
.deco{ flex:1; min-height:0; display:grid; gap:12px; grid-template-columns:.85fr 1.15fr; grid-template-rows:minmax(0,1fr); align-items:stretch; }
.deco > *{ min-height:0; min-width:0; }
.cakeBox{ display:flex; background:#EAF6F0; border:3px solid var(--ink); border-radius:18px; padding:4px; cursor:crosshair; }
.cakeSvg{ flex:1; width:100%; height:100%; min-height:0; display:block; touch-action:manipulation; }
.ctls{ display:flex; flex-direction:column; gap:6px; overflow:hidden; }
.ctl{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; }
.ctl h4{ flex-basis:100%; font-size:1.05rem; }
.stepper{ display:flex; align-items:center; gap:10px; }
.stepper b{ font-family:'Fredoka','Lalezar',sans-serif; font-size:1.5rem; min-width:1.2em; text-align:center; }
.drop{ animation:drop .5s cubic-bezier(.3,1.5,.5,1); }
.pop{ animation:pop .35s cubic-bezier(.3,1.7,.5,1); transform-box:fill-box; transform-origin:50% 100%; }
@keyframes drop{ from{ transform:translateY(-70px); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes pop{ from{ transform:scale(.3); opacity:0; } to{ transform:none; opacity:1; } }
.port .deco{ grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto; gap:6px; }
.port .ctls{ flex-direction:row; flex-wrap:wrap; align-items:center; gap:4px 8px; }
.port .ctl h4{ display:none; }
.port .tctl{ flex-basis:100%; }
.port .stepper{ gap:6px; } .port .stepper b{ font-size:1.2rem; }

/* result */
.resultGrid{ flex:1; min-height:0; display:grid; gap:14px; grid-template-columns:1fr 1fr; grid-template-rows:minmax(0,1fr); align-items:stretch; }
.resultGrid > *{ min-height:0; min-width:0; }
.resultGrid > div:last-child{ align-self:center; }
.stars{ display:flex; gap:4px; justify-content:center; }
.stars svg{ width:34px; height:34px; }
.resTitle{ text-align:center; font-size:1.5rem; margin:4px 0; }
.fixes{ list-style:none; padding:8px 12px; margin:6px 0; background:#FFF4CC; border:2.5px dashed var(--ink); border-radius:14px; display:grid; gap:2px; font-weight:700; font-size:.92rem; }
.fixes h4{ font-size:1rem; }
.pay{ display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin:6px 0; font-weight:800; }
.port .resultGrid{ grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto; gap:6px; }
.port .stars svg{ width:28px; height:28px; }
.port .resTitle{ font-size:1.15rem; margin:2px 0; }
.port .fixes{ padding:5px 10px; font-size:.82rem; margin:4px 0; }
.port .pay{ margin:4px 0; } .port .pay .chip{ font-size:.82rem; padding:0 8px; }

/* home */
.setbar{ flex:none; display:flex; margin-bottom:0; }
.homeMain{ flex:1; min-height:0; display:grid; gap:14px 28px; grid-template-columns:1fr 1fr; grid-template-areas:"sign cake" "btns cake"; grid-template-rows:auto auto; align-content:center; align-items:center; }
.homeSign{ grid-area:sign; display:flex; justify-content:center; }
.homeBtns{ grid-area:btns; }
.homeCake{ grid-area:cake; position:relative; height:430px; background:radial-gradient(circle at 50% 56%,#FFD9E5 0 54%,transparent 55%); }
.homeCake .cakeSvg{ position:absolute; inset:0; }
.pot{ position:absolute; bottom:8px; width:74px; } .pot svg{ width:100%; height:auto; display:block; }
.pot.l{ inset-inline-start:0; } .pot.r{ inset-inline-end:0; }
.sign{ position:relative; width:fit-content; max-width:100%; margin:26px 0 4px; padding:8px 36px 12px; background:#fff; border:3px solid var(--ink); border-radius:22px; box-shadow:5px 5px 0 var(--sh); text-align:center; }
.sign::before,.sign::after{ content:""; position:absolute; top:-26px; width:4px; height:26px; background:var(--ink); }
.sign::before{ inset-inline-start:22%; } .sign::after{ inset-inline-end:22%; }
.logo{ font-size:4.2rem; color:var(--butter); line-height:1.05; margin:0;
  text-shadow:-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px 3px 0 var(--ink),0 6px 0 var(--ink),3px 6px 0 var(--ink),-3px 6px 0 var(--ink); }
.tag{ font-size:1.15rem; font-weight:700; margin:2px 0 0; }
.homeActions{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-bottom:8px; }
.homeStats{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
.port .homeMain{ grid-template-columns:minmax(0,1fr); grid-template-areas:"sign" "cake" "btns"; grid-template-rows:auto minmax(0,1fr) auto; align-content:stretch; gap:6px; }
.port .homeCake{ height:100%; }
.port .sign{ padding:6px 26px 8px; margin-top:24px; } .port .logo{ font-size:3.2rem; } .port .tag{ font-size:1rem; }
.port .pot{ width:56px; }

/* intro / day end */
.screenC{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
.narrow{ width:100%; max-width:760px; max-height:100%; display:flex; flex-direction:column; gap:8px; overflow:hidden; }
.narrow h2{ font-size:2rem; }
.port .narrow h2{ font-size:1.6rem; }
.newlist{ display:flex; flex-wrap:wrap; gap:6px; }
.endStats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
.endStats > div{ background:#F3FAF6; border:3px solid var(--ink); border-radius:16px; padding:4px 6px; }
.endStats .k{ display:block; color:var(--muted); font-weight:700; font-size:.85rem; }
.endStats b{ font-family:'Fredoka','Lalezar',sans-serif; font-size:1.4rem; font-weight:400; display:inline-flex; align-items:center; gap:6px; }
.endStats .stars svg{ width:22px; height:22px; }
.narrow .actions{ margin:0; }
.shop{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.shopItem{ display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; border:3px solid var(--ink); border-radius:14px; padding:4px 8px; background:#F3FAF6; min-width:0; }
.shopItem.own{ background:#E3F6EC; }
.sIcon{ width:34px; display:grid; place-items:center; }
.sName{ min-width:0; line-height:1.15; } .sName b{ display:block; font-size:.9rem; } .sName small{ color:var(--muted); font-size:.75rem; }
.shopItem .btn{ margin:0; display:inline-flex; align-items:center; gap:5px; }
.port .shopItem{ padding:3px 6px; gap:5px; } .port .sIcon{ width:28px; } .port .sName b{ font-size:.8rem; } .port .shopItem .btn.sm{ padding:.15em .5em; font-size:.85rem; }

/* dialogs + toast */
.overlay{ position:fixed; inset:0; background:rgba(30,15,18,.55); display:grid; place-items:center; padding:16px; z-index:30; }
.dlg{ max-width:420px; width:100%; text-align:center; }
.dlg h3{ font-size:1.7rem; margin-bottom:6px; }
.dlg .sub{ margin-bottom:0; }
.dlg .actions{ margin-top:14px; }
.setRow{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:2px dashed rgba(58,32,36,.25); font-weight:800; text-align:start; }
.tog{ flex:none; width:58px; height:32px; border-radius:999px; border:3px solid var(--ink); background:#d9d4d4; position:relative; cursor:pointer; padding:0; }
.tog i{ position:absolute; top:2px; inset-inline-start:2px; width:22px; height:22px; border-radius:50%; background:#fff; border:2.5px solid var(--ink); transition:inset-inline-start .15s; }
.tog.on{ background:var(--mint); } .tog.on i{ inset-inline-start:calc(100% - 26px); }
.toast{ position:fixed; inset-inline:0; margin:auto; width:max-content; max-width:90vw; bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:#fff; padding:10px 18px; border-radius:14px; font-weight:700; z-index:40; opacity:0; transform:translateY(10px); transition:opacity .2s, transform .2s; pointer-events:none; }
.toast.show{ opacity:1; transform:none; }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{ animation:none !important; transition:none !important; } }
.overlay .dlg{ max-height:calc(100vh - 20px); overflow:auto; }
@media (max-height:520px){ .overlay .dlg{ padding:8px 14px; } .dlg h3{ font-size:1.3rem; margin-bottom:0; } .setRow{ padding:3px 0; } .volRow{ padding-bottom:0; } .volRow input{ height:18px; } .dlg .actions{ margin:4px 0 0; } .dlg .btn{ margin-bottom:0; } }
.verdict.good{ color:#1F7A55; } .verdict.ok{ color:#8A6100; } .verdict.bad{ color:#B3214C; }
.ctls .ctlActs{ flex:none; margin:0; justify-content:flex-start; gap:8px; }
.ctls .tctl{ flex:1 1 auto; min-height:0; flex-wrap:nowrap; flex-direction:column; align-items:stretch; }
.ctls .tctl .swrow{ overflow-y:auto; min-height:0; align-content:flex-start; }
.port .ctls .tctl{ flex-direction:row; flex-wrap:wrap; align-items:center; }
.volRow{ padding:0 0 8px; border-bottom:2px dashed rgba(58,32,36,.25); }
.volRow input{ width:100%; height:26px; accent-color:var(--berry); }
.setRow:has(+ .volRow){ border-bottom:0; padding-bottom:2px; }
.ctls .ctlActs{ margin:2px 0 0; }
.port .ctls .tctl{ flex-direction:column; flex-basis:100%; flex-wrap:nowrap; align-items:stretch; }
.port .ctls .tctl .swrow{ max-height:100px; overflow-y:auto; }
.port .ctls .ctlActs{ flex-basis:100%; }
/* decorate palette: compact, tight under headings, never clipped */

/* cake drawing */
var CX = 200, RX = 110, RY = 22, LH = 42, BASE = 298;
function shadeColor(hex, p){
  if (p == null) return hex;
  var raw = mix(hex, '#ffffff', .45), dark = mix(hex, '#1a0d08', .6);
  if (p < .62) return mix(raw, hex, p / .62);
  return mix(hex, dark, (p - .62) / .38);
}
function dripPath(top){
  var xs = []; for (var x = CX - RX; x <= CX + RX; x += 4) xs.push(x);
  function ey(x){ return RY * Math.sqrt(Math.max(0, 1 - Math.pow((x - CX) / RX, 2))); }
  function d(x){ return 8 + 20 * Math.pow(Math.max(0, Math.sin((x - (CX - RX)) / 9)), 3); }
  var up = xs.map(function(x){ return x + ',' + (top + ey(x)).toFixed(1); });
  var dn = xs.slice().reverse().map(function(x){ return x + ',' + (top + ey(x) + d(x)).toFixed(1); });
  return 'M' + up.join(' L') + ' L' + dn.join(' L') + ' Z';
}
function cakeSVG(o){
  var layers = o.layers || 0, toppings = o.toppings || [];
  var sc = o.flavor ? shadeColor(FLAVORS[o.flavor].color, o.shade) : '#F3CF7E';
  var fc = o.frosting ? FROSTINGS[o.frosting].color : null;
  var crumb = mix(sc, '#000000', .25);
  var s = t('<svg class="cakeSvg" viewBox="0 0 400 340" role="img" aria-label="الكيكة">');
  s += '<ellipse cx="200" cy="304" rx="175" ry="30" fill="#fff" stroke="'+INK+'" stroke-width="3"/>';
  s += '<ellipse cx="200" cy="300" rx="140" ry="24" fill="#E4F3EC" stroke="'+INK+'" stroke-width="2"/>';
  for (var i = 0; i < layers; i++){
    var bot = BASE - i * LH, top = bot - LH;
    var isLast = (i === layers - 1);
    s += '<g' + (o.animLayer && isLast ? ' class="drop"' : '') + '>';
    s += '<path d="M'+(CX-RX)+','+top+' L'+(CX-RX)+','+bot+' A'+RX+','+RY+' 0 0 0 '+(CX+RX)+','+bot+' L'+(CX+RX)+','+top+' Z" fill="'+sc+'" stroke="'+INK+'" stroke-width="3" stroke-linejoin="round"/>';
    for (var k = 0; k < 7; k++){
      var px = CX - RX + 16 + ((k * 37 + i * 53) % (2 * RX - 32));
      var py = top + 9 + ((k * 23 + i * 11) % (LH - 14));
      s += '<circle cx="'+px+'" cy="'+py+'" r="2.2" fill="'+crumb+'" opacity=".35"/>';
    }
    if (i >= 1 && fc){
      var arc = 'M'+(CX-RX)+','+bot+' A'+RX+','+RY+' 0 0 0 '+(CX+RX)+','+bot;
      s += '<path d="'+arc+'" fill="none" stroke="'+INK+'" stroke-width="11"/><path d="'+arc+'" fill="none" stroke="'+fc+'" stroke-width="5.5"/>';
    }
    s += '</g>';
  }
  if (layers > 0){
    var tp = BASE - layers * LH;
    s += '<g' + (o.animLayer ? ' class="drop"' : '') + '>';
    if (fc){
      s += '<path d="'+dripPath(tp)+'" fill="'+fc+'" stroke="'+INK+'" stroke-width="3" stroke-linejoin="round"/>';
      s += '<ellipse cx="'+CX+'" cy="'+tp+'" rx="'+RX+'" ry="'+RY+'" fill="'+fc+'" stroke="'+INK+'" stroke-width="3"/>';
      s += '<path d="M'+(CX-70)+','+(tp+2)+' Q'+CX+','+(tp-14)+' '+(CX+70)+','+(tp+2)+'" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>';
    } else {
      s += '<ellipse cx="'+CX+'" cy="'+tp+'" rx="'+RX+'" ry="'+RY+'" fill="'+mix(sc, '#ffffff', .22)+'" stroke="'+INK+'" stroke-width="3"/>';
    }
    var order = toppings.map(function(t, idx){ return { t:t, idx:idx }; }).sort(function(a, b){ return a.t.ny - b.t.ny; });
    order.forEach(function(it){
      var cx = CX + it.t.nx * (RX - 18), cy = tp + it.t.ny * (RY - 6);
      var fresh = o.animTop && it.idx === toppings.length - 1;
      s += '<g transform="translate('+cx.toFixed(1)+','+cy.toFixed(1)+')"><g'+(fresh ? ' class="pop"' : '')+'>'+toppingShape(it.t.t)+'</g></g>';
    });
    s += '</g>';
  }
  return s + '</svg>';
}

/* ---------- orders ---------- */
function makeOrder(day, name, girl){
  var maxL = day < 3 ? 2 : 3;
  var tops = unlocked(TOPPINGS, day);
  var total = Math.min(1 + Math.ceil(Math.random() * (1 + Math.min(day, 4))), 6);
  var counts = {};
  for (var i = 0; i < total; i++){ var t = rnd(tops); counts[t] = (counts[t] || 0) + 1; }
  return {
    names:name, girl:girl, get name(){ return this.names[LANG === 'en' ? 0 : 1]; },
    flavor:rnd(unlocked(FLAVORS, day)),
    frosting:rnd(unlocked(FROSTINGS, day)),
    layers:1 + Math.floor(Math.random() * maxL),
    toppings:counts,
    face:{ skin:rnd(SKINS), hair:rnd(HAIRS), shirt:rnd(SHIRTS), scarf:rnd(SHIRTS), style:rnd(girl ? ['pigtails','bun','scarf','beanie'] : ['cap','beanie']) }
  };
}

function patienceFactor(){
  var o = G.order; if (!o) return 1;

  return clamp(1 - ((performance.now() - G.t0) / 1000) / total, 0, 1);
}

function fitCanvas(){
  var cs = getComputedStyle(document.body), root = document.documentElement;
  root.style.height = window.innerHeight + 'px';
  var pl = parseFloat(cs.paddingLeft) || 0, pr = parseFloat(cs.paddingRight) || 0;
  var aw = document.body.clientWidth - pl - pr, ah = document.body.clientHeight;
  var sL = Math.min(aw / 1100, ah / 640), sP = Math.min(aw / 400, ah / 760);
  var land = sL >= sP, W = land ? 1100 : 400, H = land ? 640 : 760, sc = land ? sL : sP;
  app.className = land ? 'land' : 'port';
  app.style.width = W + 'px'; app.style.height = H + 'px';
  app.style.left = (pl + (aw - W * sc) / 2) + 'px';
  app.style.top = ((ah - H * sc) / 2) + 'px';
  app.style.transform = 'scale(' + sc + ')';
}

var PAN_BOTTOM = 182, PAN_H = 118, STREAM_Y = 36, TARGET = .72;
function stationPour(){
  var w = G.w, fl = unlocked(FLAVORS, G.day);

  $('#station').innerHTML =
    t('<h3>حضّر العجين</h3>') +

    t('<svg class="stageSvg" viewBox="0 0 280 200" role="img" aria-label="قالب الكيك">') +
      '<defs><clipPath id="panClip"><path d="M46,64 H234 L222,174 Q221,182 213,182 H67 Q59,182 58,174 Z"/></clipPath></defs>' +
      '<path d="M112,6 H176 V30 Q176,36 170,36 H118 Q112,36 112,30 Z" fill="#fff" stroke="'+INK+'" stroke-width="3" stroke-linejoin="round"/>' +
      '<path d="M176,12 q22,0 22,14 q0,12 -22,10" fill="none" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/>' +
      '<rect id="stream" x="140" y="'+STREAM_Y+'" width="9" height="0" rx="3" fill="#E9DFC8"/>' +
      '<path d="M46,64 H234 L222,174 Q221,182 213,182 H67 Q59,182 58,174 Z" fill="#DDE3EC"/>' +
      '<g clip-path="url(#panClip)"><rect id="batter" x="40" y="'+PAN_BOTTOM+'" width="200" height="0" fill="#E9DFC8"/></g>' +
      '<path d="M46,64 H234 L222,174 Q221,182 213,182 H67 Q59,182 58,174 Z" fill="none" stroke="'+INK+'" stroke-width="3.5" stroke-linejoin="round"/>' +
      '<line x1="40" x2="240" y1="'+targetY+'" y2="'+targetY+'" stroke="'+'#E23D6B'+'" stroke-width="3" stroke-dasharray="7 5"/>' +
      '<text x="262" y="'+(targetY + 4)+'" text-anchor="middle" font-size="12" font-weight="800" fill="'+INK+t('">الهدف</text>') +
    '</svg>' +
    '<p class="verdict" id="pourRes" aria-live="polite"></p>' +
    t('<div class="actions"><button class="btn big hold" id="pourBtn">اضغط واسكب</button><button class="btn alt" id="pourReset">إعادة</button></div>') +
    t('<div class="actions"><button class="btn" id="toOven" disabled>إلى الفرن</button></div>');

  var batter = $('#batter'), stream = $('#stream'), btn = $('#pourBtn');
  var pouring = false, last = 0;
  var speed = .27;
  function paintColor(){ var c = w.flavor ? FLAVORS[w.flavor].color : '#E9DFC8'; batter.setAttribute('fill', c); stream.setAttribute('fill', c); }
  function setLevel(l){
    var h = l * PAN_H, y = PAN_BOTTOM - h;
    batter.setAttribute('y', y); batter.setAttribute('height', h + 4);
    stream.setAttribute('height', pouring ? Math.max(0, y - STREAM_Y) : 0);
  }
  function tick(ts){
    if (!pouring) return;
    var dt = Math.min(.05, (ts - last) / 1000); last = ts;
    w.pour = Math.min(1, w.pour + dt * speed);
    setLevel(w.pour);
    if (w.pour >= 1){ stop(); return; }
    G.raf = requestAnimationFrame(tick);
  }
  function start(){
    if (pouring || w.pourDone) return;
    if (!w.flavor){ toast(t('اختر النكهة أول')); return; }
    pouring = true; last = performance.now(); btn.classList.add('on'); startPourSound();
    G.raf = requestAnimationFrame(tick);
  }
  function stop(){
    if (!pouring) return;
    pouring = false; cancelAnimationFrame(G.raf); btn.classList.remove('on'); stopPourSound();
    setLevel(w.pour);
    var err = Math.abs(w.pour - TARGET);
    w.pourScore = w.pour >= 1 ? 0 : clamp(Math.round(100 - err * 450), 0, 100);
    w.pourDone = true;
    var low = w.pour < TARGET, k, m;
    if (w.pour >= 1){ k = 'bad'; m = tr('Whoa, it spilled over! Tap Try again.','انسكب العجين! اضغط إعادة.'); }
    else if (w.pourScore >= 90){ k = 'good'; m = tr('Smooth pour, right on the line!','سكبة ناعمة وبالضبط عند الخط!'); }
    else if (w.pourScore >= 70){ k = 'ok'; m = low ? tr('So close! Just a tiny bit more next time.','قريب جداً! زد شوي المرة الجاية.') : tr('So close! Just a tiny bit less next time.','قريب جداً! قلل شوي المرة الجاية.'); }
    else { k = 'bad'; m = low ? tr('A little light, the cake will come out thin.','العجين قليل، الكيكة بتطلع رقيقة.') : tr('A bit too much, the cake may overflow.','العجين كثير، الكيكة ممكن تفيض.'); }
    var pr = $('#pourRes'); pr.className = 'verdict ' + k; pr.textContent = m;
    $('#toOven').disabled = w.pour >= 1;
  }
  Array.prototype.forEach.call(document.querySelectorAll('#flRow .sw'), function(b){
    b.onclick = function(){
      if (pouring) return;
      w.flavor = b.dataset.k; paintColor();
      Array.prototype.forEach.call(document.querySelectorAll('#flRow .sw'), function(x){ x.classList.toggle('sel', x === b); });
    };
  });
  btn.addEventListener('pointerdown', function(e){ e.preventDefault(); if (btn.setPointerCapture) { try { btn.setPointerCapture(e.pointerId); } catch(err){} } start(); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){ btn.addEventListener(ev, stop); });
  btn.addEventListener('keydown', function(e){ if ((e.key === ' ' || e.key === 'Enter') && !e.repeat){ e.preventDefault(); start(); } });
  btn.addEventListener('keyup', function(e){ if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); stop(); } });
  btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  $('#pourReset').onclick = function(){
    if (pouring) return;
    w.pour = 0; w.pourDone = false; w.pourScore = 0; setLevel(0); $('#pourRes').textContent = ''; $('#toOven').disabled = true;
  };
  $('#toOven').onclick = function(){ setStage('bake'); };
  paintColor(); setLevel(w.pour);
}

  '</svg>';
}
function stationBake(){
  var w = G.w, base = FLAVORS[w.flavor].color;
  var hw = .07, C = .62;
  $('#station').innerHTML =
    t('<h3>الفرن</h3>') +
    t('<p class="sub">اضغط «أخرج الكيك» لما المؤشر يدخل المنطقة الخضراء.</p>') +
    ovenSVG(base) +
    '<div class="gauge" aria-hidden="true"><div class="zone" style="inset-inline-start:'+((C - hw) * 100)+'%;width:'+(hw * 200)+'%"></div><div class="needle" id="needle"></div></div>' +
    t('<div class="gl"><span>نيّة</span><span>محروقة</span></div>') +
    '<p class="verdict" id="bakeRes" aria-live="polite"></p>' +
    t('<div class="actions"><button class="btn big" id="takeOut">أخرج الكيك</button><button class="btn big" id="toDeco" hidden>إلى التزيين</button></div>');
  var t0 = performance.now(), done = false, cur = 0, SPEED = .125;
  var bk = $('#bk'), needle = $('#needle'), smoke = $('#smoke'), temp = $('#ovenTemp');
  function paint(p){
    cur = p;
    needle.style.insetInlineStart = (p * 100) + '%';
    bk.setAttribute('fill', shadeColor(base, p));
    smoke.style.display = p > .86 ? '' : 'none';
    temp.textContent = Math.round(150 + p * 70) + '°';
  }
  function finish(p){
    if (done) return; done = true; stopLoops();
    paint(p); w.bake = p; w.shade = p;
    var d = Math.abs(p - C);
    w.bakeScore = d <= hw ? Math.round(100 - (d / hw) * 8) : clamp(Math.round(100 - (d - hw) * 500), 0, 100);
    var k, m;
    if (d <= hw){ k = 'good'; m = tr('Golden and gorgeous! Out at just the right time.','ذهبية وجميلة! طلعتها بالوقت المناسب.'); }
    else if (p < C){ k = w.bakeScore >= 60 ? 'ok' : 'bad'; m = tr('Out a little early, the middle is still gooey.','طلعتها بدري شوي، الوسط لسه طري.'); }
    else { k = w.bakeScore >= 60 ? 'ok' : 'bad'; m = tr('Oops, a bit too toasty!','أوه، محمّرة زيادة شوي!'); }
    var br = $('#bakeRes'); br.className = 'verdict ' + k; br.textContent = m;
    sfx(w.bakeScore >= 80 ? 'ding' : 'bad'); $('#takeOut').hidden = true; $('#toDeco').hidden = false; $('#toDeco').focus();
  }
  function step(ts){
    if (done) return;
    var p = Math.min(1, (ts - t0) / 1000 * SPEED);
    paint(p);
    if (p >= 1){ finish(1); return; }
    G.raf = requestAnimationFrame(step);
  }
  $('#takeOut').onclick = function(){ finish(cur); };
  $('#toDeco').onclick = function(){ setStage('decorate'); };
  G.raf = requestAnimationFrame(step);
}

  if (!w.topSel) w.topSel = tps[0];
  $('#station').innerHTML =
    t('<h3>زيّن الكيكة</h3>') +
    t('<p class="sub decoSub">رتّب الطبقات، اختر الكريمة، ثم اضغط فوق الكيكة لتضع الزينة.</p>') +
    '<div class="deco"><div class="cakeBox" id="cakeBox"></div><div class="ctls">' +
      t('<div class="ctl"><h4>الطبقات</h4><div class="stepper"><button class="btn alt sm" id="lm" aria-label="إنقاص طبقة">−</button><b id="lc">')+w.layers+t('</b><button class="btn alt sm" id="lp" aria-label="إضافة طبقة">+</button></div></div>') +
      t('<div class="ctl"><h4>الكريمة</h4><div class="swrow" id="frRow">') + frs.map(function(k){ return '<button class="sw" data-k="'+k+'" title="'+FROSTINGS[k].name+'"><span class="col" style="background:'+FROSTINGS[k].color+'"></span><span class="lbl">'+FROSTINGS[k].name+'</span></button>'; }).join('') + '</div></div>' +
      t('<div class="ctl tctl"><h4>الزينة</h4><div class="swrow" id="tpRow">') + tps.map(function(k){ return '<button class="sw" data-k="'+k+'" title="'+TOPPINGS[k].name+'">'+toppingIcon(k, 28)+'<span class="lbl">'+TOPPINGS[k].name+'</span><i class="n" data-n="'+k+'" hidden>0</i></button>'; }).join('') + '</div></div>' +
      t('<div class="actions ctlActs"><button class="btn alt sm" id="undo">تراجع</button><button class="btn alt sm" id="clr">مسح الزينة</button></div>') +
    '</div></div>' +
    t('<div class="actions"><button class="btn big" id="serve">قدّم الكيكة</button></div>');

  var box = $('#cakeBox');
  function badges(){
    var c = {}; w.toppings.forEach(function(t){ c[t.t] = (c[t.t] || 0) + 1; });
    Array.prototype.forEach.call(document.querySelectorAll('#tpRow .n'), function(el){ var n = c[el.dataset.n] || 0; el.textContent = n; el.hidden = n === 0; });
  }
  function draw(anim){
    box.innerHTML = cakeSVG({ layers:w.layers, flavor:w.flavor, shade:w.shade, frosting:w.frosting, toppings:w.toppings, animLayer:anim === 'layer', animTop:anim === 'top' });
    $('#lc').textContent = w.layers; badges();
  }
  function marks(){
    Array.prototype.forEach.call(document.querySelectorAll('#frRow .sw'), function(b){ b.classList.toggle('sel', b.dataset.k === w.frosting); });
    Array.prototype.forEach.call(document.querySelectorAll('#tpRow .sw'), function(b){ b.classList.toggle('sel', b.dataset.k === w.topSel); });
  }
  Array.prototype.forEach.call(document.querySelectorAll('#frRow .sw'), function(b){ b.onclick = function(){ w.frosting = b.dataset.k; marks(); draw(); }; });
  Array.prototype.forEach.call(document.querySelectorAll('#tpRow .sw'), function(b){ b.onclick = function(){ w.topSel = b.dataset.k; marks(); }; });
  $('#lp').onclick = function(){ if (w.layers >= 4){ toast(t('أقصى شي 4 طبقات')); return; } w.layers++; sfx('drop'); draw('layer'); };
  $('#lm').onclick = function(){ if (w.layers <= 1){ toast(t('لازم طبقة وحدة على الأقل')); return; } w.layers--; draw(); };
  $('#undo').onclick = function(){ w.toppings.pop(); draw(); };
  $('#clr').onclick = function(){ w.toppings = []; draw(); };
  box.addEventListener('pointerdown', function(e){
    var svg = box.querySelector('svg'); if (!svg) return;
    if (!w.topSel){ toast(t('اختر زينة أول')); return; }
    var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    var p = pt.matrixTransform(svg.getScreenCTM().inverse());
    var top = BASE - w.layers * LH;
    var nx = (p.x - CX) / (RX - 18), ny = (p.y - top) / (RY - 6);
    if (Math.abs(nx) > 1.6 || ny < -3.5 || ny > 2.5){ toast(t('اضغط فوق الكيكة')); return; }
    var r = Math.hypot(nx, ny); if (r > 1){ nx /= r; ny /= r; }
    if (w.toppings.length >= 10){ toast(t('الكيكة امتلأت')); return; }
    w.toppings.push({ t:w.topSel, nx:nx, ny:ny }); sfx('pop'); draw('top');
  });
  $('#serve').onclick = function(){
    if (!w.frosting){ toast(t('اختر الكريمة أول')); return; }
    goResult();
  };
  marks(); draw();
}

/* ---------- scoring + result ---------- */
function scoreOrder(o, w){
  var parts = [];
  parts.push({ label:t('سكب العجين'), s:w.pourScore, wt:.10, note:'' });
  parts.push({ label:t('الخبز'), s:w.bakeScore, wt:.20, note:w.bakeScore < 85 ? (w.bake < .62 ? t('الكيكة طلعت نيّة') : t('الكيكة احترقت شوي')) : '' });
  var fOk = w.flavor === o.flavor;
  parts.push({ label:t('النكهة'), s:fOk ? 100 : 0, wt:.15, note:fOk ? '' : t('المطلوب ') + FLAVORS[o.flavor].name });
  var ld = Math.abs(w.layers - o.layers);
  parts.push({ label:t('الطبقات'), s:ld === 0 ? 100 : ld === 1 ? 45 : 0, wt:.15, note:ld ? t('المطلوب ') + layersText(o.layers) : '' });
  var frOk = w.frosting === o.frosting;
  parts.push({ label:t('الكريمة'), s:frOk ? 100 : 0, wt:.15, note:frOk ? '' : (LANG === 'en' ? 'Ordered: ' + FROSTINGS[o.frosting].name + ' frosting' : t('المطلوب كريمة ') + FROSTINGS[o.frosting].name) });
  var have = {}; w.toppings.forEach(function(t){ have[t.t] = (have[t.t] || 0) + 1; });
  var types = {}; Object.keys(o.toppings).concat(Object.keys(have)).forEach(function(k){ types[k] = 1; });
  var diff = 0; Object.keys(types).forEach(function(k){ diff += Math.abs((o.toppings[k] || 0) - (have[k] || 0)); });
  var want = sumVals(o.toppings);
  var tS = clamp(Math.round(100 * (1 - diff / Math.max(want, 1) * .85)), 0, 100);
  parts.push({ label:t('الزينة'), s:tS, wt:.25, note:diff ? t('راجع الزينة على التذكرة') : '' });
  var total = Math.round(parts.reduce(function(a, p){ return a + p.s * p.wt; }, 0));
  return { parts:parts, total:total };
}
function goResult(){
  var o = G.order, w = G.w;
  G.speed = patienceFactor();
  var r = scoreOrder(o, w);
  var base = 10 + 4 * o.layers + 2 * sumVals(o.toppings);
  var price = Math.round(base * r.total / 100);
  var tip = r.total >= 60 ? Math.round(price * .6 * G.speed * (r.total / 100)) : 0;
  r.price = price; r.tip = tip; r.coins = price + tip;
  G.res = r; G.money += r.coins; G.dayEarned += r.coins; G.dayScores.push(r.total);
  save();
  var c = $('#coins'); if (c) c.textContent = G.money;
  setStage('result'); sfx(r.total >= 85 ? 'good' : r.total >= 55 ? 'ok' : 'bad'); setTimeout(function(){ sfx('coin'); }, 450);
  setMood(r.total >= 85 ? 'happy' : r.total >= 60 ? 'ok' : r.total >= 35 ? 'neutral' : 'sad');
  var pb = $('#pbar'); if (pb) pb.style.width = (G.speed * 100) + '%';
}
function stationResult(){
  var r = G.res, w = G.w, last = G.idx + 1 >= G.queue.length;
  var verdict = r.total >= 90 ? t('تحفة! الزبون طار من الفرحة') : r.total >= 75 ? t('حلوة، الزبون راضي') : r.total >= 55 ? t('مقبولة، بس تقدر تتحسن') : t('مو هذا اللي طلبته');
  var fixes = r.parts.filter(function(p){ return p.note; }).slice(0, 3).map(function(p){ return '<li>' + p.label + ': ' + p.note + '</li>'; }).join('');
  $('#station').innerHTML =
    '<div class="resultGrid"><div class="cakeBox" style="cursor:default">' +
      cakeSVG({ layers:w.layers, flavor:w.flavor, shade:w.shade, frosting:w.frosting, toppings:w.toppings }) +
    '</div><div>' + starsHTML(r.total / 20) +
      '<h3 class="resTitle">' + t(verdict) + '</h3>' +
      (fixes ? '<ul class="fixes"><h4>' + t(t('للتحسين')) + '</h4>' + fixes + '</ul>' : '') +
      '<div class="pay"><span class="chip">' + t(t('السعر ')) + COIN + r.price + '</span><span class="chip">' + t(t('إكرامية ')) + COIN + r.tip + '</span><span class="chip" style="background:var(--butter)">' + t(t('المجموع ')) + COIN + r.coins + '</span></div>' +
      '<div class="actions"><button class="btn big" id="next">' + t(last ? t('إنهاء اليوم') : t('الزبون التالي')) + '</button></div>' +
    '</div></div>';
  $('#next').onclick = function(){ G.idx++; if (G.idx >= G.queue.length) endDay(); else startCustomer(); };
}

/* ---------- boot ---------- */
var app = $('#app');
applyLang();
fitCanvas();
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', function(){ setTimeout(fitCanvas, 120); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitCanvas);
render();
})();
</script>
