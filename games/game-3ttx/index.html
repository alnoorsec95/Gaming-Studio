<style>
/* Layout: one centered column, a status strip on top, riddle card, 2x2 answer grid */
:root{
  --bg:#ffd9e8; --surface:#fff8fb; --fg:#4a1230; --muted:#8a5a74; --line:#f3b5cf;
  --accent:#e0246b; --accent-fg:#ffffff; --hot:#d81b60;
  --good:#dff5e1; --good-line:#2f8f46; --bad:#ffe0e0; --bad-line:#d32f2f;
  --mb0:#ff8fbd; --mb1:#7fdcd0; --ink:#4a1230; --cheek:#ff5c93; --dot:#ffc2da;
  --font-display:'Reem Kufi','Tajawal',system-ui,sans-serif;
  --font-body:'Tajawal',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2b0f21; --surface:#3b1a2f; --fg:#ffe6f0; --muted:#d4a3bb; --line:#6b2f50;
  --accent:#ff6fa5; --accent-fg:#2b0f21; --hot:#ff7ab0;
  --good:#1f3a22; --good-line:#7bc975; --bad:#4a2020; --bad-line:#ff8a80;
  --mb0:#ff8fbd; --mb1:#7fdcd0; --ink:#2b0f21; --cheek:#ff5c93; --dot:#3f1830; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2b0f21; --surface:#3b1a2f; --fg:#ffe6f0; --muted:#d4a3bb; --line:#6b2f50;
  --accent:#ff6fa5; --accent-fg:#2b0f21; --hot:#ff7ab0;
  --good:#1f3a22; --good-line:#7bc975; --bad:#4a2020; --bad-line:#ff8a80;
  --mb0:#ff8fbd; --mb1:#7fdcd0; --ink:#2b0f21; --cheek:#ff5c93; --dot:#3f1830; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 3px,transparent 3.5px),radial-gradient(var(--dot) 3px,transparent 3.5px);background-size:44px 44px;background-position:0 0,22px 22px;color:var(--fg);font-family:var(--font-body);padding-inline:16px;padding-block:24px;font-size:1.05rem}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--font-display);font-size:2.2rem;margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-size:1.5rem;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.strip{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat small{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.stat b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.lives{color:var(--hot);letter-spacing:.2em;font-size:1.3rem}
.lives .gone{opacity:.25}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hot);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.q{font-size:1.25rem;line-height:1.7;font-weight:500}
.level-tag{font-size:.8rem;letter-spacing:.06em;color:var(--hot);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;min-width:0}
.opt{background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:8px;padding:14px 8px;font-weight:700;font-size:1.1rem}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt.good{background:var(--good);border-color:var(--good-line)}
.opt.bad{background:var(--bad);border-color:var(--bad-line)}
.opt.off{opacity:.3}
.primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:12px 20px;font-weight:700}
.ghost{background:none;color:var(--fg);border:2px solid var(--line);border-radius:8px;padding:10px 16px;font-weight:700}
.ghost:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{padding:12px 14px;border-radius:8px;line-height:1.6}
.note.good{background:var(--good)} .note.bad{background:var(--bad)}
button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}

input{font:inherit;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.timer{display:flex;align-items:center;gap:10px}
.timer .bar{flex:1}
#tm{font-variant-numeric:tabular-nums;min-width:2.2ch;text-align:center}
.mas{width:96px;height:96px;flex:none;overflow:visible}
.mas .fb{fill:var(--mb0)} .mas.v1 .fb{fill:var(--mb1)}
.mas .ink{fill:var(--ink)} .mas .st{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.mas .body{stroke:var(--ink);stroke-width:3.5}
.mas .ch{fill:var(--cheek);opacity:.55}
.mas .wh{fill:#fff;stroke:var(--ink);stroke-width:2.5}
.mas .all{animation:bob 1.6s ease-in-out infinite;transform-origin:60px 100px}
.mas.dance .all{animation:dance .7s ease-in-out infinite alternate}
.mas.shock .all{animation:shake .35s linear infinite}
.mas.sad .all{animation:sag 2.2s ease-in-out infinite}
.mas .arm{transform-origin:92px 74px}
.mas.wave .arm,.mas.happy .arm,.mas.dance .arm{animation:wv .5s ease-in-out infinite alternate}
.mas .eyes{transform-origin:60px 62px;animation:blink 4s infinite}
.mas .bub{animation:pop 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-6px) scale(1.02,.98)}}
@keyframes dance{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(8deg) translateY(-8px)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes sag{50%{transform:translateY(3px) scaleY(.97)}}
@keyframes wv{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pop{50%{transform:scale(1.25);opacity:.6}}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .mas{width:72px;height:72px}
.pair{display:flex;justify-content:center;gap:8px}
.pair .mas{width:110px;height:110px}
.confetti{position:relative;height:0;overflow:visible;pointer-events:none}
.confetti i{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:fall 3.2s linear infinite}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.mas *,.mas,.confetti i{animation:none!important}}
.flag{height:120px;width:100%;max-width:220px;margin:0 auto;border:2px solid var(--line);border-radius:8px}
.emo{font-size:3.4rem;text-align:center;line-height:1.2}
.pl{position:relative}
.pl .mas{position:absolute;inset-inline-end:8px;top:50%;margin-top:-22px;width:44px;height:44px}
.pl .mas~b{padding-inline-end:48px}
.gl{fill:#4cc9f0}.gl2{fill:#3ddc97}
@keyframes popin{from{transform:scale(.88);opacity:0}}
@keyframes okp{50%{transform:scale(1.08)}}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt{animation:popin .22s}.opt.good{animation:okp .5s}.opt.bad{animation:nope .4s}

.pl{transition:box-shadow .3s}.pl.on{box-shadow:0 0 0 3px var(--hot)}
@media (prefers-reduced-motion:reduce){.opt{animation:none!important}}
.big{font-family:var(--font-display);font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums}
</style>

   think:'<circle class="ink" cx="48" cy="60" r="5"/><circle class="ink" cx="76" cy="60" r="5"/>',
   base:'<circle class="ink" cx="46" cy="62" r="5"/><circle class="ink" cx="74" cy="62" r="5"/>'};
  const mouth={
   happy:'<path class="st" d="M46 78q14 16 28 0"/>',
   dance:'<path class="st" d="M46 78q14 16 28 0"/>',
   wave:'<path class="st" d="M48 80q12 10 24 0"/>',
   sad:'<path class="st" d="M48 90q12-12 24 0"/>',
   shock:'<ellipse class="wh" cx="60" cy="86" rx="7" ry="9"/>',
   think:'<path class="st" d="M52 84h16"/>'};
  const e=eyes[mood==='dance'?'happy':(eyes[mood]?mood:'base')],m=mouth[mood]||mouth.wave;
  const extra=mood==='think'?'<g class="bub"><circle class="wh" cx="100" cy="22" r="4"/><circle class="wh" cx="108" cy="12" r="6"/></g>':'';
  return '<svg class="mas v'+v+' '+mood+'" viewBox="0 0 120 120" aria-hidden="true"><g class="all">'+
   '<path class="st" d="M60 34V20"/><circle class="fb body" cx="60" cy="16" r="6"/>'+
   '<path class="st" d="M26 78L12 92"/>'+
   '<g class="arm"><path class="st" d="M94 78l16-12"/><circle class="fb body" cx="112" cy="64" r="6"/></g>'+
   '<ellipse class="fb body" cx="60" cy="70" rx="40" ry="36"/>'+
   '<circle class="ch" cx="36" cy="78" r="6"/><circle class="ch" cx="84" cy="78" r="6"/>'+
   '<g class="eyes">'+e+'</g>'+m+extra+'</g></svg>';
}
function globe(m){
  const E={happy:'<path class="st" d="M42 58q7-9 14 0M64 58q7-9 14 0"/>',sad:'<circle class="ink" cx="48" cy="60" r="4.5"/><circle class="ink" cx="72" cy="60" r="4.5"/><path class="st" d="M40 51l12 4M80 51l-12 4"/>',shock:'<circle class="wh" cx="48" cy="58" r="8"/><circle class="wh" cx="72" cy="58" r="8"/><circle class="ink" cx="48" cy="58" r="3"/><circle class="ink" cx="72" cy="58" r="3"/>',think:'<circle class="ink" cx="50" cy="58" r="4.5"/><circle class="ink" cx="74" cy="58" r="4.5"/>'};
  const M={happy:'<path class="st" d="M48 74q12 14 24 0"/>',sad:'<path class="st" d="M50 84q10-10 20 0"/>',shock:'<ellipse class="wh" cx="60" cy="80" rx="6" ry="8"/>',think:'<path class="st" d="M52 78h16"/>'};
  return '<svg class="mas '+m+'" viewBox="0 0 120 120" aria-hidden="true"><g class="all"><path class="st" d="M36 110h48M60 102v8"/><circle class="gl body" cx="60" cy="58" r="42"/><path class="gl2" d="M26 44q6-14 20-18q4 8-6 14q-8 6-14 4z"/><path class="gl2" d="M72 86q14-6 22-14q2 12-8 20q-10 4-14-6z"/><circle class="ch" cx="38" cy="72" r="6"/><circle class="ch" cx="82" cy="72" r="6"/><g class="eyes">'+E[m]+'</g>'+M[m]+'</g></svg>';
}
function confetti(){const c=['#ff4d8d','#ffd23f','#3ddc97','#4cc9f0','#b388ff'];return '<div class="confetti" aria-hidden="true">'+Array.from({length:18},(_,i)=>'<i style="left:'+(i*5.5+2)+'%;background:'+c[i%5]+';animation-delay:'+(i%6*0.35)+'s"></i>').join('')+'</div>'}
const app=document.getElementById('app');
let CPU=false,CT=null,S,NAMES=['لاعب 1','لاعب 2'];
let AC=null,SND=true;
function tone(f,d,t,w,v){if(!SND||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+(w||0);o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}
function sfx(k){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return}
 const P={click:[[660,.06,'triangle']],good:[[523,.12,'sine',0],[659,.12,'sine',.1],[784,.25,'sine',.2]],bad:[[220,.2,'sawtooth',0,.1],[165,.35,'sawtooth',.18,.1]],tick:[[880,.05,'square',0,.05]],level:[[523,.15,'sine',0],[659,.15,'sine',.15],[784,.15,'sine',.3],[1047,.4,'sine',.45]],win:[[523,.15,'sine',0],[659,.15,'sine',.15],[784,.15,'sine',.3],[1047,.2,'sine',.45],[784,.15,'sine',.65],[1047,.5,'sine',.8]]};
 (P[k]||[]).forEach(a=>tone(a[0],a[1],a[2],a[3],a[4]))}
document.getElementById('snd').onclick=function(){SND=!SND;this.textContent=SND?'🔊':'🔇';if(SND)sfx('click')};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function init(){stopTimer();S={lv:0,qi:0,scores:[0,0],streaks:[0,0],hints:[1,1],phase:'own',opts:null,removed:[],wrongs:[],hintUsed:false,gain:0,msg:'',ok:true};screen('intro')}
const TOT=()=>LEVELS.reduce((a,l)=>a+l.qs.length,0),IDX=()=>LEVELS.slice(0,S.lv).reduce((a,l)=>a+l.qs.length,0)+S.qi;
function owner(){return IDX()%2}
function turn(){return S.phase==='steal'?1-owner():owner()}
function strip(){
  const total=TOT(),n=IDX(),t=S.phase==='done'?-1:turn();
  return '<div class="players">'+[0,1].map(i=>'<div class="pl'+(t===i?' on':'')+'">'+mascot(t===i?(S.phase==='steal'?'shock':'think'):'base',i)+'<small>'+(t===i?(S.phase==='steal'?'فرصة السرقة':'دوره'):'ينتظر')+'</small><b>'+NAMES[i]+'</b><span class="sc">'+S.scores[i]+'</span></div>').join('')+'</div>'+
  '<div class="strip"><div class="stat" style="margin-inline-start:auto"><small>السؤال</small><b>'+(n+1)+' / '+total+'</b></div></div><div class="bar"><i style="width:'+(n/total*100)+'%"></i></div>';
}
function screen(k){
  if(k==='welcome'){app.innerHTML='<style>@keyframes mbob{to{transform:translateY(-10px) rotate(4deg)}}@media (prefers-reduced-motion:reduce){.mic{animation:none!important}}</style><div class="mic" style="font-size:9rem;text-align:center;line-height:1.1;animation:mbob 3s ease-in-out infinite alternate">🗺️</div><h1 style="text-align:center;font-size:2.7rem;margin-top:4px">رحلة حول العالم</h1><p class="muted" style="text-align:center">سافر عبر ستين محطة من الأعلام والعواصم والأناشيد والجغرافيا.</p><div class="row" style="justify-content:center"><button class="primary" id="st" style="font-size:1.2rem;padding:14px 38px">🧭 ابدأ الرحلة</button></div>';document.getElementById('st').onclick=()=>{sfx('click');screen('intro')}}else if(k==='intro'){
    const N=TOT();
    app.innerHTML='<div class="hero"><h1>رحلة حول العالم</h1>'+mascot('wave',0)+'</div><p class="muted">'+N+' لغزًا في '+LEVELS.length+' مراحل: الدول العربية، ثم البرمجة، ثم الأعلام والعواصم والأناشيد الوطنية. العبوا لاعبين على جهاز واحد أو تحدَّ الكمبيوتر.</p>'+
    '<div class="row"><button class="'+(CPU?'ghost':'primary')+'" id="m2">لاعبان</button><button class="'+(CPU?'primary':'ghost')+'" id="m1">لاعب ضد الكمبيوتر</button></div>'+
    '<div class="card"><label for="n1">'+(CPU?'اسمك':'اسم اللاعب الأول')+'<input id="n1" value="'+NAMES[0]+'" maxlength="14"></label>'+(CPU?'':'<label for="n2">اسم اللاعب الثاني<input id="n2" value="'+NAMES[1]+'" maxlength="14"></label>')+
    '<p class="muted">الإجابة الصحيحة بمئة نقطة، وتتابع الصحيحات يضيف عشر نقاط لكل إجابة حتى أربعين. إذا أخطأ صاحب السؤال تنتقل الفرصة إلى خصمه لسرقتها بخمسين نقطة. لكل سؤال عشرون ثانية، وإذا انتهى الوقت يعدّ خطأ. لكل لاعب تلميح واحد يحذف إجابتين ويخفض نقاط السؤال إلى النصف.</p></div>'+
    '<div class="row"><button class="primary" id="go">ابدأ المنافسة</button></div>';
    const sv=()=>{NAMES[0]=document.getElementById('n1').value.trim()||'لاعب 1';const e=document.getElementById('n2');if(e)NAMES[1]=e.value.trim()||'لاعب 2'};
    document.getElementById('m2').onclick=()=>{sv();CPU=false;if(NAMES[1]==='الكمبيوتر')NAMES[1]='لاعب 2';screen('intro')};
    document.getElementById('m1').onclick=()=>{sv();CPU=true;screen('intro')};
    document.getElementById('go').onclick=()=>{sv();sfx('click');if(CPU)NAMES[1]='الكمبيوتر';startTimer();screen('q')};
  }else if(k==='q'){
    const L=LEVELS[S.lv],q=L.qs[S.qi];
    if(!S.opts)S.opts=shuffle([q[1]].concat(q[2]));
    const done=S.phase==='done';
    let h=strip()+'<div class="card">'+(done&&S.ok?confetti():'')+'<div class="top"><span class="level-tag">'+L.name+' · '+q[3]+'</span>'+globe(S.phase==='done'?(S.ok?'happy':'sad'):(S.phase==='steal'?'shock':'think'))+'</div><p class="q">'+q[0]+'</p>'+(q[4]?(typeof q[4]==='string'?'<div class="emo">'+q[4]+'</div>':'<div class="flag" style="background:'+flagCss(q[4])+'"></div>'):'')+'<div class="opts">'+
    S.opts.map((o,i)=>{let c='opt';
      if(S.removed.includes(o))c+=' off';
      if(done&&o===q[1])c+=' good';else if(S.wrongs.includes(o))c+=' bad';
      return '<button class="'+c+'" data-o="'+i+'"'+((done||(CPU&&turn()===1)||S.removed.includes(o)||S.wrongs.includes(o))?' disabled':'')+'>'+o+'</button>'}).join('')+'</div>';
    if(!done)h+='<div class="timer"><b id="tm">'+S.t+'</b><div class="bar"><i id="tb" style="width:'+(S.t/20*100)+'%"></i></div></div>';
    if(S.phase==='own')h+='<div class="row"><button class="ghost" id="hint"'+((S.hints[owner()]&&!(CPU&&owner()===1))?'':' disabled')+'>تلميح ('+S.hints[owner()]+')</button><span class="muted">السؤال لـ '+NAMES[owner()]+'</span></div>';
    if(S.phase==='steal')h+='<div class="note bad">'+NAMES[owner()]+' أخطأ. الفرصة لـ '+NAMES[1-owner()]+' بخمسين نقطة.</div>';
    if(done)h+='<div class="note '+(S.ok?'good':'bad')+'">'+S.msg+'</div><div class="row"><button class="primary" id="next">'+(IDX()===TOT()-1?'عرض النتيجة':'التالي')+'</button></div>';
    app.innerHTML=h+'</div>';
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(S.opts[+b.dataset.o]));
    if(CPU&&!done&&turn()===1)CT=setTimeout(cpuMove,1500+Math.random()*2000);
    const hb=document.getElementById('hint');if(hb)hb.onclick=useHint;
    const nb=document.getElementById('next');if(nb)nb.onclick=next;
  }else if(k==='level'){sfx('level');
    const lead=S.scores[0]===S.scores[1]?'التعادل قائم.':(S.scores[0]>S.scores[1]?NAMES[0]:NAMES[1])+' في المقدمة.';
    app.innerHTML=strip()+'<div class="card"><div class="pair">'+mascot('dance',0)+mascot('dance',1)+'</div><h2>أنهيتما '+LEVELS[S.lv-1].name.split(':')[0]+'</h2><p class="muted">'+lead+' المرحلة التالية أصعب.</p><div class="row"><button class="primary" id="go">ابدأ '+LEVELS[S.lv].name.split(':')[0]+'</button></div></div>';
    document.getElementById('go').onclick=()=>{startTimer();screen('q')};
  }else if(k==='end'){sfx('win');
    const [a,b]=S.scores,t=a===b;
    app.innerHTML='<div class="card">'+confetti()+'<div class="pair">'+(t?mascot('dance',0)+mascot('dance',1):mascot('happy',a>b?0:1))+'</div><h2>'+(t?'تعادل':'الفائز: '+NAMES[a>b?0:1])+'</h2><div class="players">'+[0,1].map(i=>'<div class="pl'+(!t&&S.scores[i]>S.scores[1-i]?' on':'')+'"><b>'+NAMES[i]+'</b><span class="sc">'+S.scores[i]+'</span></div>').join('')+'</div>'+
    '<div class="row"><button class="primary" id="again">جولة جديدة</button></div></div>';
    document.getElementById('again').onclick=init;
  }
}
let TI=null;
function stopTimer(){clearInterval(TI);TI=null;clearTimeout(CT)}
function cpuMove(){if(!CPU||S.phase==='done'||turn()!==1)return;const q=LEVELS[S.lv].qs[S.qi],av=S.opts.filter(o=>!S.wrongs.includes(o)&&!S.removed.includes(o)),p=[.95,.85,.75,.7,.65,.6,.6,.55,.5,.45][S.lv]??.5,w=av.filter(o=>o!==q[1]);answer(Math.random()<p||!w.length?q[1]:w[Math.floor(Math.random()*w.length)])}
function startTimer(){stopTimer();S.t=20;TI=setInterval(()=>{S.t--;if(S.t<=5&&S.t>0&&!(CPU&&turn()===1))sfx('tick');const a=document.getElementById('tm'),b=document.getElementById('tb');if(a)a.textContent=S.t;if(b)b.style.width=(S.t/20*100)+'%';if(S.t<=0)timeout()},1000)}
function timeout(){
  stopTimer();sfx('bad');const q=LEVELS[S.lv].qs[S.qi],ow=owner();
  if(S.phase==='own'){S.streaks[ow]=0;S.phase='steal';startTimer();screen('q')}
  else{S.ok=false;S.msg='انتهى الوقت ولم يجب أحد صح. الجواب: '+q[1]+'.';S.phase='done';screen('q')}
}
function useHint(){
  const q=LEVELS[S.lv].qs[S.qi],o=owner();S.hints[o]=0;S.hintUsed=true;
  S.removed=shuffle(q[2]).slice(0,2);screen('q');
}
function answer(o){
  const q=LEVELS[S.lv].qs[S.qi],ow=owner(),ok=o===q[1];sfx(ok?'good':'bad');
  if(S.phase==='own'){
    if(ok){S.streaks[ow]++;S.gain=Math.round((100+Math.min(S.streaks[ow]-1,4)*10)*(S.hintUsed?.5:1));S.scores[ow]+=S.gain;stopTimer();S.phase='done';S.ok=true;S.msg=NAMES[ow]+' أجاب صح وكسب '+S.gain+' نقطة.'}
    else{S.streaks[ow]=0;S.wrongs.push(o);S.phase='steal';startTimer()}
  }else{
    const th=1-ow;
    if(ok){S.scores[th]+=50;S.ok=true;S.msg=NAMES[th]+' سرق السؤال وكسب 50 نقطة.'}
    else{S.wrongs.push(o);S.ok=false;S.msg='لم يجب أحد صح. الجواب: '+q[1]+'.'}
    stopTimer();S.phase='done';
  }
  screen('q');
}
function next(){
  S.qi++;S.phase='own';S.opts=null;S.removed=[];S.wrongs=[];S.hintUsed=false;
  if(S.qi>=LEVELS[S.lv].qs.length){S.qi=0;S.lv++;
    if(S.lv>=LEVELS.length){screen('end');return}
    screen('level');return}
  startTimer();screen('q');
}
init();screen('welcome');
</script>
