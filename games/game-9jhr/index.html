<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شردة في الفريج</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#1b1410;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;touch-action:none;user-select:none;color:#fff}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:16px;right:16px;display:flex;justify-content:space-between;font-weight:700;text-shadow:0 1px 4px #000;pointer-events:none}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,.25) 40%,rgba(0,0,0,.82) 100%);padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
#ui h1{margin:0 0 8px;font-size:2rem}#ui p{margin:4px 0;opacity:.9}
#ui button{margin-top:16px;font-size:1.2rem;padding:12px 32px;border:0;border-radius:12px;background:#f6b26b;color:#3b2a14;font-weight:700}
#mu,#cm{pointer-events:auto;background:rgba(0,0,0,.35);border:0;border-radius:50%;width:34px;height:34px;font-size:16px;color:#fff;margin-inline-start:8px}
#ch{display:flex;justify-content:center;gap:9px;margin-top:8px}#nm{font-size:1.6rem;font-weight:700;margin-top:6px;text-shadow:0 2px 6px #000}#hint{font-size:.8rem;opacity:.75;margin:4px 0 0}#ch[style*="none"]~#nm,#ch[style*="none"]~#hint,#ch[style*="none"]~#shopLbl,#ch[style*="none"]~#cShop,#ch[style*="none"]~#eShop{display:none}#ui #ch button{margin:0;flex:0 0 10px;width:10px;height:10px;border-radius:50%;font-size:0;transition:transform .2s;padding:0;background:rgba(255,255,255,.18);color:#fff;border:2px solid transparent}#ui #ch button.on{background:#f6b26b;color:#3b2a14;border-color:#fff;transform:scale(1.5)}
#ui #ch button.locked{opacity:.4}
#eraPick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 2px;width:min(440px,100%)}
#ui #eraPick button{margin:0;padding:8px 10px;font-size:.88rem;line-height:1.35;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;border:2px solid rgba(255,255,255,.25);transition:transform .15s,background .15s,border-color .15s}
#ui #eraPick button small{display:block;font-weight:500;opacity:.75;font-size:.72rem}
#ui #eraPick button.on{background:#f6b26b;color:#3b2a14;border-color:#fff;transform:scale(1.04)}
#ui #eraPick button.on small{opacity:.85}
#cShop,#eShop{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
#cShop button,#eShop button{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.45);cursor:pointer;position:relative;padding:0;font-size:13px;display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 2px #000}
#cShop button.sel,#eShop button.sel{border-color:#f6b26b;box-shadow:0 0 0 2px #f6b26b}
#cShop button.locked,#eShop button.locked{opacity:.6}
#cShop button .pr,#eShop button .pr{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:9px;white-space:nowrap;background:rgba(0,0,0,.55);padding:1px 4px;border-radius:6px}
#shopLbl{font-size:.68rem;opacity:.65;margin:10px 0 2px}
#pzBtn{pointer-events:auto;background:rgba(0,0,0,.35);border:0;border-radius:50%;width:34px;height:34px;font-size:15px;color:#fff;margin-inline-start:8px}
#pz{position:fixed;inset:0;pointer-events:none;z-index:11;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
#pz:not(.hide){pointer-events:auto}
.pzBox{background:rgba(30,20,10,.92);border-radius:16px;padding:28px 36px;text-align:center}
.pzBox h2{margin:0 0 16px}
.pzBox button{font-size:1.1rem;padding:10px 28px;border:0;border-radius:12px;background:#f6b26b;color:#3b2a14;font-weight:700}
#tut{position:fixed;left:50%;top:36%;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.5);padding:14px 20px;border-radius:14px;pointer-events:none;opacity:0;transition:opacity .5s}
#tut.show{opacity:1}
.tutRow{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;text-shadow:0 1px 3px #000}
.tutRow span:first-child{font-size:22px}
#pg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 52px);left:16px;right:16px;height:6px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden;pointer-events:none}#pi{display:block;height:100%;width:0;background:#f6b26b}
#en{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);left:0;right:0;text-align:center;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000;pointer-events:none}
#tt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12%);max-width:86%;background:rgba(0,0,0,.55);color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;text-align:center;opacity:0;transition:opacity .6s;pointer-events:none}
#hr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 84px);right:16px;font-size:22px;text-shadow:0 1px 3px #000;pointer-events:none;letter-spacing:2px}
#cb{color:#f6b26b;font-weight:900;margin-inline-start:8px;opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s;display:inline-block}
#cb.show{opacity:1;transform:scale(1)}
#pw{position:fixed;top:calc(env(safe-area-inset-top,0px) + 112px);right:16px;display:flex;flex-direction:row-reverse;gap:6px;pointer-events:none}
#pw span{background:rgba(0,0,0,.4);border-radius:10px;padding:3px 9px;font-size:12px;font-weight:700;text-shadow:0 1px 2px #000}
#pt{position:fixed;top:calc(env(safe-area-inset-top,0px) + 84px);left:16px;width:46px;height:46px;border-radius:50%;border:2px solid #f6b26b;background:rgba(0,0,0,.35);pointer-events:none}
.hide{display:none!important}
#vg{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%)}
#gr{position:fixed;inset:0;pointer-events:none;z-index:4;mix-blend-mode:soft-light;transition:background-color 1s ease;background:transparent}
#sl{position:fixed;inset:0;pointer-events:none;z-index:3}
#dmg{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,rgba(220,20,20,0) 40%,rgba(220,20,20,.4) 100%);opacity:0;transition:opacity .16s ease-out}
#dmg.on{opacity:1;transition:opacity .04s}
#cn{display:inline-block;transition:transform .08s}
#cn.bump{animation:cnBump .32s ease}
@keyframes cnBump{30%{transform:scale(1.4)}100%{transform:scale(1)}}
.pop{position:fixed;pointer-events:none;color:#ffd54a;font-weight:900;font-size:17px;text-shadow:0 2px 5px #000;z-index:12;animation:popUp .75s ease forwards}
@keyframes popUp{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}15%{transform:translate(-50%,-75%) scale(1.15);opacity:1}100%{transform:translate(-50%,-150%) scale(1);opacity:0}}
#hud,#ui,#tt,#hr,#pw,#pt,#pg,#en{z-index:10}

/* ---- تخطيط شاشة البداية: أزرار اللون والتعبير فوق رأس الشخصية، والنصوص والعصور في الأسفل ---- */
#ui{justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 48px) 12px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(to bottom,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 50%,rgba(0,0,0,.45) 66%,rgba(0,0,0,.88) 100%)}
#uiTop,#uiBot{width:100%;display:flex;flex-direction:column;align-items:center}
#uiTop{position:relative}
#uiBot{margin-top:auto}
#ui:has(#ch[style*="none"]) #uiTop{display:none}
#ui h1{font-size:1.5rem;margin:6px 0 2px;text-shadow:0 2px 6px #000}
#ui p{text-shadow:0 1px 4px #000}
#ui #m{font-size:.78rem;line-height:1.4;margin:2px 0}
#eraPick{grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 0;width:min(520px,100%)}
#ui #eraPick button{padding:6px 3px;font-size:.74rem;line-height:1.25;border-radius:10px;min-height:46px}
#ui #eraPick button small{font-size:.62rem}
#ui #eraPick button.on{transform:none;box-shadow:0 0 0 2px #fff}

@media (max-height:700px){#ui{padding-top:calc(env(safe-area-inset-top,0px) + 44px)}#ui h1{font-size:1.3rem}#ui #m{font-size:.7rem}#ui #eraPick button{min-height:40px;font-size:.7rem}#nm{font-size:1.1rem}#ui #b{padding:8px 34px;font-size:1.05rem;margin-top:6px}}
@media (max-height:560px){#ui #m{display:none}#hint{display:none}}
#ui #ttl{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:nowrap;white-space:nowrap;max-width:100%;margin:6px 0 2px}
#ui #ttl h1{margin:0;font-size:clamp(1.05rem,5.2vw,1.5rem);letter-spacing:.2px;color:#fff;text-shadow:0 2px 6px #000}
#ui #sub{display:inline-block;font-size:clamp(.56rem,2.9vw,.8rem);font-weight:700;color:#ffd9a3;background:rgba(246,178,107,.16);border:1px solid rgba(246,178,107,.55);border-radius:12px;padding:3px 9px;text-shadow:0 1px 3px #000}
#ui #m:empty{display:none}
#en{display:none!important} /* أُزيل نص اسم المرحلة العلوي في الشاشتين: البداية واللعب */
/* أزرار اللون والتعبير في سطر، وقائمتها في السطر الثاني تحتها */
#shopTabs{display:flex;gap:8px;justify-content:center}
#ui #shopTabs>button{margin:0;padding:7px 14px;font-size:.85rem;border-radius:18px;background:rgba(0,0,0,.5);color:#fff;border:2px solid rgba(255,255,255,.3);font-weight:700;white-space:nowrap;pointer-events:auto}
#ui #shopTabs>button.on{background:#f6b26b;color:#3b2a14;border-color:#fff}
#shopPanel{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);max-width:100%;z-index:2}
#shopPanel>div{display:none;margin:0;padding:10px 12px 22px;background:rgba(20,12,6,.72);border-radius:16px;justify-content:center;gap:8px;flex-wrap:wrap;max-width:94vw;pointer-events:auto}
#shopTabs[data-open="cShop"]+#shopPanel>#cShop,#shopTabs[data-open="eShop"]+#shopPanel>#eShop{display:flex}
/* أزرار العصور: أيقونة كبيرة واسم واضح وسنة، والعصر المختار بلون ساطع */
#ui #eraPick>button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:7px 3px 6px;min-height:68px;border-radius:12px;background:rgba(28,17,8,.86);color:#fff;border:2px solid rgba(246,178,107,.5);box-shadow:0 2px 6px rgba(0,0,0,.45);text-shadow:none;font-size:.72rem;line-height:1.2;transition:background .15s,border-color .15s,transform .1s}
#ui #eraPick>button .ei{font-size:1.45rem;line-height:1.1}
#ui #eraPick>button .en2{font-weight:800;font-size:.74rem;line-height:1.2}
#ui #eraPick>button small{font-size:.62rem;font-weight:600;color:#ffd9a3;opacity:.95;margin-top:auto}
#ui #eraPick>button:active{transform:scale(.96)}
#ui #eraPick>button.on{background:linear-gradient(180deg,#ffd08a,#f6b26b);color:#2e1c08;border-color:#fff;box-shadow:0 0 0 2px #f6b26b,0 3px 10px rgba(246,178,107,.55);transform:none}
#ui #eraPick>button.on small{color:#5a3a14}
@media (max-height:700px){#ui #eraPick>button{min-height:58px;padding:5px 2px}#ui #eraPick>button .ei{font-size:1.2rem}#ui #eraPick>button .en2{font-size:.68rem}}
/* أزرار العصور بخط أكبر وأوضح: شبكة 2×2 */
#eraPick{grid-template-columns:repeat(2,1fr)!important;gap:8px!important;width:min(460px,100%)!important}
#ui #eraPick>button{flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;padding:8px 12px;min-height:56px;text-align:right}
#ui #eraPick>button .ei{font-size:1.7rem;line-height:1;flex:0 0 auto}
#ui #eraPick>button .tx{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
#ui #eraPick>button .en2{font-size:1rem;font-weight:800;line-height:1.2;color:inherit;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#ui #eraPick>button small{font-size:.8rem;font-weight:700;margin-top:0;color:#ffe3b8}
#ui #eraPick>button.on .en2{text-shadow:none}
#ui #eraPick>button.on small{color:#4a2c0c}
@media (max-height:700px){#ui #eraPick>button{min-height:48px;padding:5px 10px}#ui #eraPick>button .ei{font-size:1.4rem}#ui #eraPick>button .en2{font-size:.92rem}#ui #eraPick>button small{font-size:.74rem}}
#ui #eraPick>button.locked{background:rgba(20,14,8,.85);border:2px dashed rgba(255,255,255,.35);color:rgba(255,255,255,.62);box-shadow:none;filter:grayscale(.7)}
#ui #eraPick>button.locked .ei{font-size:1.5rem;opacity:.85}
#ui #eraPick>button.locked small{color:rgba(255,255,255,.55);font-weight:600}
#ui #eraPick>button.nope{animation:nope .35s}
@keyframes nope{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
</style>
</head>
<body>
<canvas id="sl"></canvas><div id="gr"></div><div id="vg"></div><div id="dmg"></div>
<div id="hud"><span id="d">0 م</span><span id="cn">🪙 0</span><span id="cb"></span><span id="bs"></span><button id="cm">👁</button><button id="mu">🔊</button><button id="pzBtn">⏸</button></div><div id="tt"></div><div id="hr"></div><div id="pw"></div><canvas id="pt" width="64" height="64"></canvas><div id="pg"><i id="pi"></i></div><div id="en"></div>
<div id="tut"><div class="tutRow"><span>⬆️</span><span>اسحب لأعلى = قفز</span></div><div class="tutRow"><span>⬇️</span><span>اسحب لأسفل = انزلاق</span></div><div class="tutRow"><span>⬅️➡️</span><span>اسحب يمين/يسار = تغيير الحارة</span></div></div>
<div id="pz" class="hide"><div class="pzBox"><h2>⏸ إيقاف مؤقت</h2><button id="pzR">استمرار ▶</button></div></div>
<div id="ui"><div id="uiTop"><div id="shopTabs" data-open=""><button type="button" data-p="cShop"><span class="ic">🎨</span><span class="lb"> لون الثياب</span></button><button type="button" data-p="eShop"><span class="ic">😊</span><span class="lb"> تعبير الوجه</span></button></div><div id="shopPanel"><div id="cShop"></div><div id="eShop"></div></div></div><div id="uiBot"><div id="ch"><button data-f="0">👳 طفاش</button><button data-f="1">🧕 عميمه</button><button data-f="2">جسوم ⚪</button><button data-f="3">عذاري 💙</button><button data-f="4">موزة 💛</button><button data-f="5">حجي مكي ❤️</button><button data-f="6">غلومي 🔘</button></div><div id="nm"></div><p id="hint">⇦ اسحب الشخصية لتغييرها ⇨</p><div id="ttl"><h1 id="t">شردة في الفريج 🏃</h1><span id="sub">اهرب من بو دلّة عبر ٤ عصور من تاريخ البحرين!</span></div><p id="m"></p><p id="s"></p><div id="eraPick" role="group" aria-label="اختر العصر"><button type="button" data-e="0"><span class="ei">🏺</span><span class="tx"><span class="en2">الفريج القديم</span><small>قبل 1932م</small></span></button><button type="button" data-e="1"><span class="ei">🛢️</span><span class="tx"><span class="en2">عصر النفط</span><small>1932م</small></span></button><button type="button" data-e="2"><span class="ei">🏛️</span><span class="tx"><span class="en2">الاستقلال والطفرة</span><small>1971م</small></span></button><button type="button" data-e="3"><span class="ei">🏙️</span><span class="tx"><span class="en2">البحرين الحديثة</span><small>اليوم</small></span></button></div><button id="b">ابدأ</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const LANE=2.5,GRAV=-22,JUMP=8.5,SLIDE_T=.8;
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.3;
document.body.prepend(R.domElement);
const sc=new THREE.Scene();
const skyC=dark?0x2a1d33:0xa6d0ee;sc.background=new THREE.Color(skyC);sc.fog=new THREE.Fog(skyC,25,100);
const cam=new THREE.PerspectiveCamera(60,1,.1,200);
let baseFov=60,fp=false;
const slC=document.getElementById('sl'),slX=slC.getContext('2d');
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;baseFov=innerWidth<innerHeight?72:58;cam.fov=baseFov;cam.updateProjectionMatrix();
  slC.width=innerWidth;slC.height=innerHeight}
addEventListener('resize',rs);rs();
const hemi=new THREE.HemisphereLight(0xfff1d6,0x4a3a2a,.9);sc.add(hemi);
const fill=new THREE.DirectionalLight(0xffffff,0);fill.position.set(0,3,-6);sc.add(fill);let pDirty=3,slideT=0,slideDir=0;
const sun=new THREE.DirectionalLight(dark?0xaabbff:0xffe2b0,dark?.6:1.35);
sun.position.set(-8,16,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
Object.assign(sun.shadow.camera,{left:-16,right:16,top:40,bottom:-40,near:1,far:80});
sun.target.position.set(0,0,-8);sc.add(sun,sun.target);
const M=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function mesh(geo,mat,x=0,y=0,z=0,p){const o=new THREE.Mesh(geo,mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;(p||0)&&p.add(o);return o}
const bx=(w,h,d)=>new THREE.BoxGeometry(w,h,d),cy=(r,h,s=16)=>new THREE.CylinderGeometry(r,r,h,s);

// road: stone flagstones
const rc=document.createElement('canvas');rc.width=256;rc.height=256;
const rg=rc.getContext('2d');
{const N=70,pts=[];for(let i=0;i<N;i++)pts.push([Math.random()*256,Math.random()*256,Math.random()]);
 const img=rg.createImageData(256,256),pal=[[196,184,160],[178,166,142],[205,193,170],[168,160,148],[188,172,140]];
 for(let y=0;y<256;y++)for(let x=0;x<256;x++){let d1=1e9,d2=1e9,k=0;
  for(let i=0;i<N;i++){let dx=Math.abs(x-pts[i][0]);if(dx>128)dx=256-dx;let dy=Math.abs(y-pts[i][1]);if(dy>128)dy=256-dy;
   const d=Math.sqrt(dx*dx+dy*dy);if(d<d1){d2=d1;d1=d;k=i}else if(d<d2)d2=d}
  const o=(y*256+x)*4,e=d2-d1,c=pal[(pts[k][2]*5)|0],m=(e<2.2?.45:e<4?.8:1)*(.9+pts[k][2]*.15),n=(Math.random()-.5)*10;
  img.data[o]=c[0]*m+n;img.data[o+1]=c[1]*m+n;img.data[o+2]=c[2]*m+n;img.data[o+3]=255}
 rg.putImageData(img,0,0);rg.fillStyle='rgba(70,50,30,.28)';[85,171].forEach(x=>rg.fillRect(x-1.5,0,3,256))}
let rt=new THREE.CanvasTexture(rc);rt.wrapS=rt.wrapT=THREE.RepeatWrapping;rt.repeat.set(1,26.7);rt.anisotropy=4;
const road=mesh(new THREE.PlaneGeometry(LANE*3,200),new THREE.MeshStandardMaterial({map:rt,roughness:.95}),0,0,-85);
road.rotation.x=-Math.PI/2;road.castShadow=false;sc.add(road);
const gnd=mesh(new THREE.PlaneGeometry(120,200),M(0xcbb48a,1),0,-.02,-85);gnd.rotation.x=-Math.PI/2;gnd.castShadow=false;sc.add(gnd);

let AC,mute=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.12,f2,delay=0){const a=ac();if(!a||mute)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
function noise(d,v=.2,fr=1200,delay=0){const a=ac();if(!a||mute)return;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=Math.random()*2-1;const sr=a.createBufferSource();sr.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fr;const g=a.createGain(),t=a.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);sr.connect(f);f.connect(g);g.connect(a.destination);sr.start(t)}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

    // الشخصية تُرسم داخل المساحة الفارغة بين كتلة العصور (أعلى) وكتلة تغيير الشكل (أسفل) حتى لا تغطيها الكتابة
    const W=innerWidth,H=innerHeight,mT=$('uiTop').getBoundingClientRect(),mB=$('uiBot').getBoundingClientRect(),y0=mT.height>0?mT.bottom+88:56,y1=Math.max(y0+110,mB.top-8),bh=y1-y0;
    const f=Math.min(85,Math.max(24,2*Math.atan(1.85*H/(2*5.5*bh*.68))*180/Math.PI));
    cam.fov=f;cam.aspect=W/H;cam.position.set(0,.9,-5.5);cam.lookAt(0,.9,0);
    cam.setViewOffset(W,H,0,-((y0+bh/2)-H/2),W,H);menuK=Math.tan(20*Math.PI/180)/Math.tan(f*Math.PI/360);
    const so=Math.max(0,1-(performance.now()-slideT)/300);pl.visible=true;pl.position.set(slideDir*so*so*3,0,0);pl.rotation.set(0,pDirty>0?0:Math.sin(t*.8)*.5,0);pl.scale.set(1,1,1);
    aL.rotation.x=Math.sin(t*2)*.12;aR.rotation.x=-Math.sin(t*2)*.12;lL.rotation.x=0;lR.rotation.x=0;
    chaser.visible=false;gate.visible=false;plShadow.visible=false;chShadow.visible=false;auraRing.visible=false;auraGlow.visible=false;for(const o of st.obs)o.m.visible=false;for(const c of st.cl)c.m.visible=false;for(const p of st.pw)p.m.visible=false}
  else{if(cam.view&&cam.view.enabled)cam.clearViewOffset();for(const o of st.obs)o.m.visible=true;for(const c of st.cl)c.m.visible=true;for(const p of st.pw)p.m.visible=true}
  drawSpeedLines();
  R.render(sc,cam);
  if(menu&&pDirty>0&&performance.now()-slideT>300){const q=$('pt').getContext('2d'),W2=R.domElement.width,H2=R.domElement.height,v=new THREE.Vector3(0,1.78,0).project(cam),sz=H2*.15*menuK;
    q.clearRect(0,0,64,64);q.drawImage(R.domElement,(v.x*.5+.5)*W2-sz/2,(-v.y*.5+.5)*H2-sz/2,sz,sz,0,0,64,64);pDirty--}}
let timeScale=1,slowUntil=0,menuK=1;
function loop(ts){const rdt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(trans){if(cam.view&&cam.view.enabled)cam.clearViewOffset();trans.t+=rdt;const p=Math.min(1,trans.t/trans.dur),e=p*p*(3-2*p);
    cam.position.set(0,2.2+(1-e)*.6,trans.z0+(trans.z1-trans.z0)*e);cam.lookAt(0,1.5,trans.z1-8);
    cam.fov=baseFov-e*8;cam.updateProjectionMatrix();
    gate.visible=true;gate.position.z=0;pl.visible=false;chaser.visible=false;plShadow.visible=false;chShadow.visible=false;
    for(const o of st.obs)o.m.visible=false;for(const c of st.cl)c.m.visible=false;for(const p2 of st.pw)p2.m.visible=false;
    drawSpeedLines();R.render(sc,cam);
    if(trans.t>=trans.dur){const cb=trans.cb;trans=null;cb&&cb()}
    requestAnimationFrame(loop);return}
  if(performance.now()>slowUntil)timeScale=Math.min(1,timeScale+rdt*2.5);
  const dt=paused?0:rdt*timeScale;
  if(running&&!paused)update(dt);render(dt);requestAnimationFrame(loop)}
$('cm').onclick=e=>{fp=!fp;$('cm').style.opacity=fp?1:.6;e.stopPropagation()};
$('mu').onclick=e=>{mute=!mute;$('mu').textContent=mute?'🔇':'🔊';e.stopPropagation()};
$('pzBtn').onclick=e=>{e.stopPropagation();togglePause()};
$('pzR').onclick=e=>{e.stopPropagation();togglePause()};
$('b').onclick=()=>{ac();startAudio();showToast(ERAS[era].n+' — '+ERAS[era].t);reset();$('ui').classList.add('hide');running=true;showTutorial()};
let runStart=0; // العصر الذي بدأت منه الجولة، حتى لا تُمنح إنجازات الرحلة الكاملة لمن بدأ من منتصفها
// العصور مقفلة: لا ينفتح عصر إلا بعد إنهاء العصر الذي يسبقه (يُحفظ التقدم في المتصفح)
var eraUnlocked=0;try{eraUnlocked=Math.min(ERAS.length-1,Math.max(0,+localStorage.getItem('sharda_eraUnlocked')||0))}catch(e){}
function unlockEra(n){n=Math.min(ERAS.length-1,n);if(n>eraUnlocked){eraUnlocked=n;try{localStorage.setItem('sharda_eraUnlocked',n)}catch(e){}}}
function renderEraPick(){document.querySelectorAll('#eraPick button').forEach(b=>{const e=+b.dataset.e,on=e===era,lk=e>eraUnlocked;
  const ic=b.querySelector('.ei'),sm=b.querySelector('small');
  if(ic&&!ic.dataset.ic)ic.dataset.ic=ic.textContent;if(sm&&!sm.dataset.y)sm.dataset.y=sm.textContent;
  if(ic)ic.textContent=lk?'🔒':ic.dataset.ic;if(sm)sm.textContent=sm.dataset.y;
  b.classList.toggle('locked',lk);b.classList.toggle('on',on&&!lk);b.setAttribute('aria-pressed',on&&!lk);b.setAttribute('aria-disabled',lk)})}
function selectEra(e){
  if(e!==era){era=e;coins0=0;hearts0=2;runStart=e;buildEra(e)}
  const E=ERAS[e];
  $('t').textContent='شردة في الفريج 🏃';
  $('m').innerHTML='<b>المرحلة '+(e+1)+': '+E.n+' ('+E.y+')</b><br>'+E.t;
  $('s').textContent='';$('b').textContent='ابدأ';
  $('ch').style.display='flex';if(typeof centerCh==='function')centerCh(chIdx);
  renderEraPick();
}
document.querySelectorAll('#eraPick button').forEach(b=>b.onclick=ev=>{ev.stopPropagation();ac();const e=+b.dataset.e;
  if(e>eraUnlocked){tone(180,.12,'sawtooth',.06,120);b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');showToast('🔒 أنهِ مرحلة «'+ERAS[e-1].n+'» أولاً لفتح هذا العصر');return}
  tone(660,.07,'triangle',.08,880);selectEra(e)});
renderEraPick();
buildEra(0);requestAnimationFrame(loop);

// أزرار اللون والتعبير: الضغط على أحدهما يفتح قائمته على السطر نفسه، والضغط عليه ثانية يغلقها
(function(){const bar=document.getElementById('shopTabs'),tabs=bar.querySelectorAll(':scope>button');
  bar.addEventListener('pointerdown',e=>e.stopPropagation());const pnl=document.getElementById('shopPanel');if(pnl)pnl.addEventListener('pointerdown',e=>e.stopPropagation());
  tabs.forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const k=b.dataset.p,open=bar.dataset.open===k?'':k;bar.dataset.open=open;tabs.forEach(x=>x.classList.toggle('on',x.dataset.p===open))}))
})();

// العبارة الترحيبية بجانب العنوان تظهر فقط مع العنوان الأصلي (لا مع شاشات «انمسكت» و«أكملت»)
(function(){const t=document.getElementById('t'),sub=document.getElementById('sub');if(!t||!sub)return;
  new MutationObserver(()=>{sub.hidden=t.textContent.trim()!=='شردة في الفريج 🏃'}).observe(t,{childList:true,characterData:true,subtree:true})})();
</script>
