<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ورشة البيتزا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: cookbook menu of recipe cards first; then the pizza pan on a checkered kitchen tabletop at the start side with a recipe card + ingredient tray at the end; stacks on phones. One committed dark-green kitchen look. */
:root{
  color-scheme:dark;
  direction:rtl;
  --ground:#143328;
  --ground-2:#183a2d;
  --panel:#1e4739;
  --panel-line:#33614f;
  --ink:#fff4dc;
  --ink-dim:#b7cbbd;
  --tomato:#d63a1f;
  --tomato-edge:#8e2411;
  --gold:#f4c95d;
  --gold-ink:#3a2a00;
  --pan:#aeb6ba;
  --pan-edge:#8c9599;
  --font-display:'Lalezar','Tajawal',system-ui,sans-serif;
  --font-body:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
body{
  background-color:var(--ground);
  background-image:repeating-conic-gradient(var(--ground-2) 0 25%,transparent 0 50%);
  background-size:64px 64px;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.5;
  padding-block:20px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:16px}
.gv{display:grid;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
h1{margin:0;font:400 clamp(36px,6vw,54px)/1.05 var(--font-display);text-wrap:balance}
.reset{font:700 15px var(--font-body);color:var(--ink);background:transparent;border:1.5px solid var(--panel-line);border-radius:999px;padding:8px 18px;cursor:pointer}
.reset:hover{border-color:var(--gold)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* cookbook */
.book{display:grid;gap:14px}
.book-t{margin:0;font:400 clamp(30px,5vw,42px)/1.1 var(--font-display)}
.book-p{margin:0;color:var(--ink-dim);max-width:52ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.rcard{display:grid;justify-items:center;align-content:start;gap:6px;padding:16px 14px 18px;text-align:center;color:var(--ink);background:rgba(0,0,0,.2);border:1.5px solid var(--panel-line);border-radius:14px;cursor:pointer;font-family:var(--font-body);transition:transform .15s,border-color .15s,background .15s}
.rcard:hover{transform:translateY(-3px);border-color:var(--gold);background:rgba(0,0,0,.28)}
.mini{width:100%;max-width:150px;aspect-ratio:1;display:block;margin-bottom:4px}
.rname{font:400 30px/1.1 var(--font-display)}
.rdesc{color:var(--ink-dim);font-size:15px}
.rneed{margin-top:4px;font-weight:700;font-size:14px;color:var(--gold)}

.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.step{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 12px;border-radius:999px;border:1.5px solid var(--panel-line);color:var(--ink-dim);font-weight:700;font-size:15px;transition:background .25s,color .25s,border-color .25s}
.step .mk{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:11px;line-height:1}
.step.now{border-color:var(--gold);color:var(--ink)}
.step.done{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.step.done .mk::after{content:"✓";font-weight:800}

.game{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.stage{display:grid;gap:14px;justify-items:center;min-width:0}
.say{width:100%;max-width:520px;min-height:3.4em;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:10px 14px;display:flex;align-items:center;font-size:16px;transition:border-color .2s}
.say.warn{border-color:var(--gold)}
.panwrap{width:min(100%,500px);aspect-ratio:1;border-radius:50%}
.stage.baking .panwrap{animation:glow .9s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 30px 6px rgba(255,150,50,.35)}to{box-shadow:0 0 72px 20px rgba(255,120,30,.62)}}
#pizza{display:block;width:100%;height:100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4));touch-action:manipulation}

#pizza{--crust:#e4b877;--dough:#efcb94;--melt:#f3cb62;--sauce:#c93a22}
#pizza.baked{--crust:#bf7f3c;--dough:#d9a76a;--melt:#e3a83c;--sauce:#a92e1b}
.pan{fill:var(--pan);stroke:var(--pan-edge);stroke-width:3;transition:stroke .15s}
.pan-rim{fill:none;stroke:rgba(255,255,255,.38);stroke-width:2}
#pizza.hot .pan{stroke:var(--gold);stroke-width:6}
.crust{fill:var(--crust);transition:fill 4s ease}
.dough-in{fill:var(--dough);transition:fill 4s ease}
.speck{fill:#fff;fill-opacity:.3}
.sauce{fill:var(--sauce);transition:fill 4s ease}
.swirl{fill:none;stroke:#e4553a;stroke-opacity:.5;stroke-width:5;stroke-linecap:round}
.melt{fill:var(--melt);fill-opacity:.62;transition:fill 4s ease}
.sh1{fill:#fbe08c;transition:fill 4s ease}
.sh2{fill:#f1c459;transition:fill 4s ease}
#pizza.baked .sh1{fill:#f0c06a}
#pizza.baked .sh2{fill:#dda044}
#gTop{transition:filter 4s ease}
#pizza.baked #gTop{filter:saturate(1.15) brightness(.88)}
.top-item{cursor:pointer}
.top-item.out{animation:out .2s forwards}
@keyframes out{to{opacity:0}}
.spot{fill:#9e4b16;opacity:0;animation:spot 1s ease forwards}
@keyframes spot{to{opacity:.42}}
.hint{animation:breathe 2.2s ease-in-out infinite;transition:opacity .4s}
.hint.gone{opacity:0;animation:none;pointer-events:none}
.hint circle{fill:none;stroke:#78838a;stroke-width:2.5;stroke-dasharray:8 8}
.hint text{font-family:var(--font-body);font-weight:700;font-size:21px;fill:#566066;text-anchor:middle}
@keyframes breathe{50%{opacity:.5}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{opacity:1;transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

.actions{width:100%;display:grid;justify-items:center;gap:12px;min-height:64px}
.bake{font:400 27px/1 var(--font-display);padding:13px 38px 11px;border-radius:999px;border:0;background:var(--tomato);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--tomato-edge);transition:transform .1s,box-shadow .1s}
.bake:hover:not(:disabled){transform:translateY(-1px)}
.bake:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--tomato-edge)}
.bake:disabled{background:#2f5646;color:#86a595;box-shadow:none;cursor:not-allowed}
.progress{width:min(100%,520px);display:grid;gap:8px;text-align:center;font-weight:700}
.track{height:12px;border-radius:999px;background:#0f261d;overflow:hidden;border:1px solid var(--panel-line)}
.fill{height:100%;width:0;background:linear-gradient(90deg,#f4c95d,#ee7a2b);transition:width 4.5s linear}
.result{width:min(100%,520px);background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:18px;display:grid;gap:10px;justify-items:center;text-align:center}
.stars{display:flex;gap:6px}
.rstars{color:var(--gold);letter-spacing:2px;font-size:18px}
.bkwrap{width:100%;max-width:860px;margin-inline:auto;container-type:inline-size}
.bk{position:relative;width:100%;aspect-ratio:1.5;perspective:2600px;transition:transform .9s cubic-bezier(.4,.1,.2,1)}
.leaf{position:absolute;top:0;left:0;width:50%;height:100%;transform-style:preserve-3d;transform-origin:right center;transition:transform .9s cubic-bezier(.4,.1,.2,1);cursor:pointer}
.leaf.fl{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;padding:3.4cqw 3cqw;display:grid;align-content:start;justify-items:center;gap:1cqw;text-align:center;color:#3b2a14;font-size:max(11px,2cqw);border-radius:.8cqw;box-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.35)}
.face.f{background:linear-gradient(to left,rgba(60,40,10,.28),transparent 9%),#fbf1dc}
.face.b{transform:rotateY(180deg);background:linear-gradient(to right,rgba(60,40,10,.28),transparent 9%),#fbf1dc}
.cover{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:1cqw;background:linear-gradient(135deg,#8e2411,#c0442a);color:var(--gold);box-shadow:inset 0 0 0 1cqw rgba(244,201,93,.35)}
.cover.back{background:#8e2411}
.ct{font:400 6cqw/1 var(--font-display)}
.cs{font-size:max(11px,1.8cqw);opacity:.85}
.face .mini{width:17cqw;max-width:none}
.cover .mini{width:26cqw;margin:1cqw 0}
.face .rname{font-size:4.4cqw}
.face .rdesc{color:#6b5a3e;font-size:max(11px,2cqw)}
.face .rneed{color:#a5471b;font-size:max(11px,1.9cqw)}
.face .rstars{color:#c4871a;font-size:max(12px,2.4cqw)}
.face .again{font-size:max(13px,2.4cqw);padding:.9cqw 3cqw .7cqw}
.bt{margin:0;font:400 4.4cqw/1.1 var(--font-display)}
.bp{margin:0;color:#6b5a3e}
.idxs{display:grid;gap:.8cqw;width:100%}
.idx{display:flex;justify-content:space-between;align-items:center;font:700 max(11px,2cqw) var(--font-body);color:#3b2a14;background:rgba(60,40,10,.08);border:0;border-radius:.8cqw;padding:.8cqw 1.4cqw;cursor:pointer}
.idx:hover{background:rgba(60,40,10,.16)}
.bknav{justify-self:center;display:flex;align-items:center;gap:16px;font-weight:700;color:var(--ink-dim)}
.bkwrap{max-width:880px}
.bk{aspect-ratio:1.28}
.bk::after{content:"";position:absolute;top:-1.2cqw;left:49%;width:2.4cqw;height:20cqw;background:linear-gradient(90deg,#d6a021,#f4c95d 50%,#d6a021);clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);z-index:30;pointer-events:none}
.cover{background:radial-gradient(circle at 30% 20%,#c9482c,#7d1f10 75%);box-shadow:inset 0 0 0 1.1cqw #8e2411,inset 0 0 0 1.4cqw rgba(244,201,93,.75),inset 0 0 0 2.4cqw #8e2411,inset 0 0 0 2.6cqw rgba(244,201,93,.45)}
.cover::after{content:"";position:absolute;top:0;bottom:0;right:0;width:3cqw;background:linear-gradient(to left,rgba(0,0,0,.5),transparent)}
.cover.back::after{right:auto;left:0;background:linear-gradient(to right,rgba(0,0,0,.5),transparent)}
.ct{color:#f8d77c;text-shadow:0 .3cqw .5cqw rgba(0,0,0,.5)}
.cover .mini{width:30cqw;filter:drop-shadow(0 .8cqw 1cqw rgba(0,0,0,.5))}

/* ===== غلاف جديد ===== */
.cover.cv2{place-content:unset;display:grid;grid-template-rows:auto 1fr auto;align-items:center;justify-items:center;gap:0;padding:5.2cqw 4.4cqw 4.6cqw;overflow:hidden;
  background:
   radial-gradient(circle at 50% 46%,rgba(255,170,80,.30),transparent 52%),
   repeating-linear-gradient(45deg,rgba(0,0,0,.10) 0 1px,transparent 1px 7px),
   repeating-linear-gradient(-45deg,rgba(0,0,0,.10) 0 1px,transparent 1px 7px),
   radial-gradient(circle at 30% 12%,#d4553a,#8a2412 62%,#5a1308)}
.cv-corner{position:absolute;width:7cqw;height:7cqw;color:#f4c95d;z-index:2;filter:drop-shadow(0 .2cqw .2cqw rgba(0,0,0,.5))}
.cv-corner.c1{top:3.3cqw;left:3.3cqw}
.cv-corner.c2{top:3.3cqw;right:3.3cqw;transform:scaleX(-1)}
.cv-corner.c3{bottom:3.3cqw;left:3.3cqw;transform:scaleY(-1)}
.cv-corner.c4{bottom:3.3cqw;right:3.3cqw;transform:scale(-1)}
.cv-top{display:grid;justify-items:center;gap:.2cqw;text-align:center;position:relative;z-index:3}
.cv-kick{display:flex;align-items:center;gap:1.2cqw;color:#f8d77c;font:700 max(10px,1.7cqw)/1 var(--font-body);letter-spacing:.2cqw}
.cv-kick::before,.cv-kick::after{content:"";width:6cqw;height:.25cqw;background:linear-gradient(90deg,transparent,#f4c95d)}
.cv-kick::after{transform:scaleX(-1)}
.cv-t1{font:400 4.6cqw/1.1 var(--font-display);color:#fff4dc;text-shadow:0 .35cqw .5cqw rgba(0,0,0,.55)}
.cv-t2{font:400 12.5cqw/.95 var(--font-display);padding:.4cqw 1cqw 0;background:linear-gradient(180deg,#fff6c8 0%,#f7d06a 42%,#c98d1c 78%,#f1c557 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 .5cqw .35cqw rgba(0,0,0,.55))}
.cv-med{position:relative;width:36cqw;aspect-ratio:1;margin-block:1.5cqw;z-index:2}
.cv-med::before{content:"";position:absolute;inset:-16%;border-radius:50%;background:repeating-conic-gradient(rgba(255,226,140,.20) 0 5deg,transparent 5deg 10deg);-webkit-mask:radial-gradient(circle,#000 52%,transparent 71%);mask:radial-gradient(circle,#000 52%,transparent 71%)}
.cv-disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 38%,#a52e18,#4d0f06 85%);box-shadow:0 0 0 .5cqw #f4c95d,0 0 0 .9cqw #6e1a0c,0 0 0 1.15cqw rgba(244,201,93,.7),0 1cqw 2cqw rgba(0,0,0,.55),inset 0 0 3cqw rgba(0,0,0,.6)}
.cv-disc::after{content:"";position:absolute;inset:6%;border-radius:50%;border:.25cqw dashed rgba(244,201,93,.55)}
.cv-p{position:absolute;transform:translate(-50%,-50%);z-index:3}
.cover .cv-p .mini{width:100%;max-width:none;margin:0;display:block;filter:drop-shadow(0 .3cqw .35cqw rgba(0,0,0,.65))}
.cv-foot{display:grid;justify-items:center;gap:.9cqw;text-align:center;position:relative;z-index:3}
.cv-rib{white-space:nowrap;position:relative;background:linear-gradient(180deg,#f8d77c,#e0a92f);color:#4a1608;font:400 max(13px,3.1cqw)/1 var(--font-display);padding:1cqw 3.2cqw .7cqw;box-shadow:0 .35cqw 0 #8f6411,0 .8cqw 1cqw rgba(0,0,0,.4);clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.cv-hint{font:700 max(10px,1.7cqw)/1 var(--font-body);color:#f6e3b0;opacity:.9}
@media(max-width:700px){
  .cover.cv2{padding:7cqw 5cqw 6.5cqw}
  .cv-t1{font-size:5.4cqw}.cv-t2{font-size:14cqw}
  .cv-med{width:40cqw}
  .cv-kick{font-size:max(10px,2.1cqw)}.cv-kick::before,.cv-kick::after{width:5cqw}
  .cv-hint{font-size:max(10px,2.1cqw)}.cv-rib{font-size:max(11px,2.9cqw);padding:1.2cqw 3.6cqw .9cqw}
  .cv-corner{width:8cqw;height:8cqw}
}
.face.f{background:linear-gradient(to left,rgba(60,40,10,.3),transparent 9%),radial-gradient(circle at 50% 0,#fffaf0,#f6e6c2)}
.face.b{background:linear-gradient(to right,rgba(60,40,10,.3),transparent 9%),radial-gradient(circle at 50% 0,#fffaf0,#f6e6c2)}
.rin{display:grid;justify-items:center;gap:1cqw;width:100%}
.rno{display:flex;align-items:center;gap:1cqw;color:#a5471b;font-weight:800;font-size:max(10px,1.6cqw)}
.rno::before,.rno::after{content:"";width:5cqw;height:1px;background:currentColor;opacity:.5}
.ph{width:30cqw;padding:1.3cqw;background:repeating-conic-gradient(#d63a1f 0 25%,#fff4dc 0 50%) 0 0/3cqw 3cqw;border:.5cqw solid #fff;border-radius:.6cqw;box-shadow:0 .6cqw 1.4cqw rgba(0,0,0,.35);transform:rotate(-2deg)}
.ph .mini{width:100%;max-width:none;margin:0;display:block}
.face .rname{color:#8e2411}
.face .rneed{display:flex;flex-wrap:wrap;justify-content:center;gap:.6cqw}
.chip{display:inline-flex;align-items:center;gap:.4cqw;background:rgba(142,36,17,.1);color:#5a2a14;border-radius:999px;padding:.3cqw 1cqw;font-weight:800;font-size:max(10px,1.8cqw)}
.chip svg{width:max(11px,3.2cqw);height:max(11px,3.2cqw)}
.idx{background:none;padding:.5cqw 0}
.dots{flex:1;border-bottom:.3cqw dotted rgba(60,40,10,.4);margin:0 1cqw;transform:translateY(.4cqw)}
.leaf:not(.fl):hover{transform:rotateY(4deg)}
.leaf.fl:hover{transform:rotateY(176deg)}
.bk{aspect-ratio:1.22}
.face{font-size:max(12px,2.2cqw);font-weight:500}
.ph{width:32cqw}
.face .rname{font-size:max(22px,5cqw)}
.face .rdesc{color:#4a3a22;font-size:max(12px,2.2cqw);line-height:1.45}
.face .rneed{font-size:max(11px,2cqw)}
.chip{color:#4a1d0f;font-size:max(11px,2cqw);background:rgba(142,36,17,.14);padding:.4cqw 1.2cqw}
.chip svg{width:max(13px,3.6cqw);height:max(13px,3.6cqw)}
.face .rstars{font-size:max(14px,2.8cqw)}
.face .again{font-size:max(14px,2.6cqw)}
.rno{font-size:max(11px,1.8cqw)}
.bp{color:#4a3a22;font-size:max(12px,2.1cqw)}
.bt{font-size:max(22px,4.8cqw)}
.idx{font-size:max(12px,2.3cqw);color:#2e1f0c}
.d1,.d2{color:#2f7d46}.d3{color:#b97a0c}.d4{color:#c0441f}.d5{color:#8e1b9c}.d0{color:#2a5ea8}
.dif{font-weight:800;font-size:max(11px,1.9cqw);letter-spacing:.04em}
.idxs{gap:.45cqw}
.idx{gap:1cqw;padding:.4cqw 1cqw;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 .2cqw rgba(60,40,10,.2);font-size:max(12px,2cqw)}
.idx:hover{background:#fff;box-shadow:inset 0 0 0 .3cqw #d63a1f}
.num{flex:none;width:3.4cqw;height:3.4cqw;min-width:18px;min-height:18px;border-radius:50%;background:#c0341c;color:#fff;display:grid;place-items:center;font:800 max(11px,1.8cqw) var(--font-body)}
.idx>span:first-of-type{font-weight:800;color:#2e1f0c}
.dd{font-weight:800;font-size:max(10px,1.7cqw)}
.bt{color:#8e2411}
.face.f{box-shadow:-.35cqw .2cqw 0 #ece0c4,-.7cqw .4cqw 0 #ddd0b0,-1.05cqw .6cqw 0 #cdbf9b,0 .6cqw 1.6cqw rgba(0,0,0,.35)}
.face.b{box-shadow:.35cqw .2cqw 0 #ece0c4,.7cqw .4cqw 0 #ddd0b0,1.05cqw .6cqw 0 #cdbf9b,0 .6cqw 1.6cqw rgba(0,0,0,.35)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(to left,rgba(40,25,5,.55),transparent 70%)}
.face.b::after{background:linear-gradient(to right,rgba(40,25,5,.55),transparent 70%)}
.leaf.turn .face::after{animation:shade .95s ease-in-out}
@keyframes shade{0%,100%{opacity:0}45%{opacity:1}}
.arr{position:absolute;top:50%;translate:0 -50%;z-index:40;display:grid;justify-items:center;gap:.2cqw;width:max(40px,6cqw);padding:.6cqw 0 .8cqw;border:0;border-radius:999px;background:rgba(20,51,40,.85);color:var(--gold);cursor:pointer;box-shadow:0 .4cqw 1.2cqw rgba(0,0,0,.5),0 0 0 .3cqw var(--gold);transition:opacity .3s}
.arr i{font:700 max(26px,4.6cqw)/1 var(--font-body);font-style:normal;animation:nudge 1.3s ease-in-out infinite}
.arr small{font:800 max(10px,1.5cqw)/1 var(--font-body);color:var(--ink)}
.arr.l{left:-1cqw}.arr.r{right:-1cqw}
.arr.r i{animation-name:nudgeR}
.arr:disabled{opacity:0;pointer-events:none}
@keyframes nudge{50%{transform:translateX(-22%)}}

  var ORDER=['pepperoni','margherita','sausage','caprese','mushroom','spicy','spinach','hawaii','tuna','veggie','med','chickencorn','florentine','prawn','supreme','mexican','seafood','meat','chef','royal','free'];

  function isOff(type){

    return !(type in R.need) && R.allow.indexOf(type)<0;
  }
  function needMet(){

  function topsDone(){

  function toSvg(cx,cy){var p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse())}

  function block(type){
    if(S.baking||S.baked) return 'البيتزا في الفرن.';
    if(type==='dough') return S.dough?'العجينة موجودة بالفعل.':null;
    if(type==='sauce'){ if(!S.dough) return 'ابدأ بالعجينة أولاً.'; return S.sauce?'الصلصة موجودة بالفعل.':null; }
    if(type==='cheese'){ if(!S.sauce) return 'افرد الصلصة قبل الجبن.'; return S.cheese?'الجبن موجود بالفعل.':null; }
    if(!S.cheese) return 'ضع الجبن أولاً، ثم الإضافات.';
    if(count(type)>=TOP[type].limit) return 'امتلأت البيتزا من هذا النوع.';
    return null;
  }

  function needText(){
    var R=RECIPES[current];
    return Object.keys(R.need).map(function(t){return TOP[t].name+' ×'+fmt(R.need[t])}).join('، ');
  }
  function guide(){
    if(S.baking) return 'البيتزا في الفرن، انتظر قليلاً.';
    if(S.baked) return 'بيتزتك جاهزة!';
    if(!S.dough) return 'ابدأ بالعجينة: اسحبها إلى الصينية أو اضغط عليها.';
    if(!S.sauce) return 'الآن الصلصة. اسحبها فوق العجينة لتُفرد.';
    if(!S.cheese) return 'أضف الجبن فوق الصلصة.';
    if(current==='free') return tops.length?'جميل. أضف المزيد أو ادخل بها الفرن.':'ضع ما تحب من الإضافات، ثم ادخل بها الفرن.';
    if(topsDone()) return 'اكتملت الوصفة! ادخل بها الفرن.';
    return 'أضف إضافات الوصفة: '+needText()+'.';
  }
  function say(msg,warn){
    sayEl.textContent=msg; sayEl.classList.toggle('warn',!!warn);
    clearTimeout(sayTimer);
    sayTimer=setTimeout(function(){sayEl.textContent=guide();sayEl.classList.remove('warn')},2600);
  }

  function addDough(){
    var g=el('g',{'class':'pop'});
    g.appendChild(el('circle',{'class':'crust',cx:C,cy:C,r:172}));
    g.appendChild(el('circle',{'class':'dough-in',cx:C,cy:C,r:158}));
    for(var i=0;i<30;i++){
      var a=rand(0,6.283), r=rand(160,169);
      g.appendChild(el('circle',{'class':'speck',cx:(C+Math.cos(a)*r).toFixed(1),cy:(C+Math.sin(a)*r).toFixed(1),r:rand(1.2,2.6).toFixed(1)}));
    }
    gDough.appendChild(g); S.dough=true;
  }

  function addSauce(){
    var pts=[], i;
    for(i=0;i<72;i++){
      var a=i/72*Math.PI*2, r=152+Math.sin(a*5+1.3)*3+Math.sin(a*9)*2;
      pts.push((C+Math.cos(a)*r).toFixed(1)+','+(C+Math.sin(a)*r).toFixed(1));
    }
    var g=el('g',{'class':'pop'});
    g.appendChild(el('polygon',{'class':'sauce',points:pts.join(' ')}));
    var d='';
    for(i=0;i<=120;i++){
      var t=i/120*Math.PI*5, rr=t/(Math.PI*5)*138;
      d+=(i?'L':'M')+(C+Math.cos(t)*rr).toFixed(1)+' '+(C+Math.sin(t)*rr).toFixed(1);
    }
    g.appendChild(el('path',{'class':'swirl',d:d}));
    gSauce.appendChild(g); S.sauce=true;
  }

  function addCheese(){
    gCheese.appendChild(el('circle',{'class':'melt pop',cx:C,cy:C,r:146}));
    for(var i=0;i<95;i++){
      var a=rand(0,6.283), r=Math.sqrt(Math.random())*142;
      var g=el('g',{transform:'translate('+(C+Math.cos(a)*r).toFixed(1)+' '+(C+Math.sin(a)*r).toFixed(1)+') rotate('+rand(0,180).toFixed(0)+')'});
      g.appendChild(el('rect',{'class':'shred pop '+(i%2?'sh1':'sh2'),x:-13,y:-3,width:26,height:6,rx:3,style:'animation-delay:'+rand(0,.7).toFixed(2)+'s'}));
      gCheese.appendChild(g);
    }
    S.cheese=true;
  }

  function spot(s){
    var best={x:C,y:C}, bd=-1;
    for(var i=0;i<40;i++){
      var a=rand(0,6.283), r=Math.sqrt(Math.random())*R_TOP;
      var x=C+Math.cos(a)*r, y=C+Math.sin(a)*r;
      var d=tops.reduce(function(m,o){return Math.min(m,Math.hypot(o.x-x,o.y-y))},999);
      if(d>bd){bd=d;best={x:x,y:y}}
      if(d>s*0.95) return {x:x,y:y};
    }
    return best;
  }

  function addTop(type,pt){
    var s=TOP[type].size*rand(.92,1.1), x, y;
    if(pt){
      var dx=pt.x-C, dy=pt.y-C, d=Math.hypot(dx,dy), max=R_TOP+8;
      if(d>max){dx*=max/d;dy*=max/d}
      x=C+dx; y=C+dy;
    } else { var p=spot(s); x=p.x; y=p.y; }
    var g=el('g',{'class':'top-item',transform:'translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+rand(0,360).toFixed(0)+')'});
    var inner=el('g',{'class':'pop'});
    inner.appendChild(el('use',{href:'#i-'+type,x:(-s/2).toFixed(1),y:(-s/2).toFixed(1),width:s.toFixed(1),height:s.toFixed(1)}));
    g.appendChild(inner); gTop.appendChild(g);
    tops.push({type:type,x:x,y:y,s:s,node:g});
  }

  function place(type,pt,btn){
    var m=block(type);
    if(m){
      say(m,true);
      if(btn){btn.classList.remove('nope');void btn.offsetWidth;btn.classList.add('nope')}
      return;
    }
    var isTop=!(type==='dough'||type==='sauce'||type==='cheese');
    if(type==='dough') addDough();
    else if(type==='sauce') addSauce();
    else if(type==='cheese') addCheese();
    else addTop(type,pt);
    render();
    if(isTop&&isOff(type)) say('هذه الإضافة ليست من الوصفة، وستؤثر على التقييم.',true);
  }

  function renderRecipe(){
    var R=RECIPES[current], h='<h2>'+R.name+'</h2><ul>';
    ['dough','sauce','cheese'].forEach(function(k){
      h+='<li class="'+(S[k]?'ok':'')+'"><span class="mk"></span>'+BASE_NAMES[k]+'</li>';
    });
    var keys=Object.keys(R.need);
    if(!keys.length){
      h+='<li class="free"><span class="mk"></span>ضع ما تحب من الإضافات</li>';
    } else {
      keys.forEach(function(t){
        var c=count(t), ok=c>=R.need[t];
        h+='<li class="'+(ok?'ok':'')+'"><span class="mk"></span>'+TOP[t].name+'<b>'+fmt(Math.min(c,R.need[t]))+' / '+fmt(R.need[t])+'</b></li>';
      });
    }
    recipeEl.innerHTML=h+'</ul>';
  }

  function render(){
    var td=topsDone();
    var done={dough:S.dough,sauce:S.sauce,cheese:S.cheese,tops:S.cheese&&td,oven:S.baked};
    $$('.step').forEach(function(li){
      var k=li.dataset.k, now=false;
      if(k==='dough') now=!S.dough;
      else if(k==='sauce') now=S.dough&&!S.sauce;
      else if(k==='cheese') now=S.sauce&&!S.cheese;
      else if(k==='tops') now=S.cheese&&!td&&!S.baking&&!S.baked;
      else if(k==='oven') now=S.cheese&&td&&!S.baked;
      li.classList.toggle('done',!!done[k]);
      li.classList.toggle('now',now&&!done[k]);
    });
    $$('.ing').forEach(function(b){
      var t=b.dataset.type, base=(t==='dough'||t==='sauce'||t==='cheese');
      var isDone=base&&S[t];
      var locked=!isDone&&((t==='sauce'&&!S.dough)||(t==='cheese'&&!S.sauce)||(!base&&!S.cheese));
      b.classList.toggle('done',isDone);
      b.classList.toggle('locked',locked);
      var n=b.querySelector('.n');
      if(n){var c=count(t);n.hidden=c===0;n.textContent=fmt(c)+'/'+fmt(TOP[t].limit)}
    });
    $('#hint').classList.toggle('gone',S.dough);
    bakeBtn.disabled=!(S.cheese&&!S.baking&&!S.baked);
    pick.classList.toggle('off',S.baking||S.baked);
    warned=false; undoBtn.disabled=S.baking||S.baked||!S.dough;
    renderRecipe();
    sayEl.textContent=guide(); sayEl.classList.remove('warn');
  }

  svg.addEventListener('click',function(e){
    if(S.baking||S.baked) return;
    var n=e.target.closest&&e.target.closest('.top-item'); if(!n) return;
    var i=tops.findIndex(function(o){return o.node===n}); if(i<0) return;
    tops.splice(i,1);
    n.classList.add('out'); setTimeout(function(){n.remove()},200);
    render();
  });

  function makeGhost(btn){
    var g=document.createElement('div'); g.className='ghost';
    g.innerHTML=btn.querySelector('svg').outerHTML;
    document.body.appendChild(g); return g;
  }

  $$('.ing').forEach(function(btn){
    var type=btn.dataset.type;
    btn.addEventListener('pointerdown',function(e){
      if(e.pointerType==='mouse'&&e.button!==0) return;
      var sx=e.clientX, sy=e.clientY, ghost=null;
      function inPan(cx,cy){var p=toSvg(cx,cy);return Math.hypot(p.x-C,p.y-C)<=200?p:null}
      function move(ev){
        if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8) ghost=makeGhost(btn);
        if(ghost){
          ghost.style.transform='translate('+(ev.clientX-30)+'px,'+(ev.clientY-30)+'px) rotate(-8deg)';
          svg.classList.toggle('hot',!!inPan(ev.clientX,ev.clientY)&&!S.baking&&!S.baked);
        }
      }
      function end(ev,cancelled){
        window.removeEventListener('pointermove',move);
        window.removeEventListener('pointerup',up);
        window.removeEventListener('pointercancel',cancel);
        svg.classList.remove('hot');
        if(ghost){
          ghost.remove();
          if(!cancelled){
            var p=inPan(ev.clientX,ev.clientY);
            if(p) place(type,p,btn); else say('أسقطها فوق الصينية.',true);
          }
        } else if(!cancelled){ place(type,null,btn); }
      }
      function up(ev){end(ev,false)}
      function cancel(ev){end(ev,true)}
      window.addEventListener('pointermove',move);
      window.addEventListener('pointerup',up);
      window.addEventListener('pointercancel',cancel);
    });
    btn.addEventListener('click',function(e){ if(e.detail===0) place(type,null,btn); });
  });

  function addSpots(){
    for(var i=0;i<16;i++){
      var a=rand(0,6.283), r=Math.sqrt(Math.random())*138;
      gBake.appendChild(el('circle',{'class':'spot',cx:(C+Math.cos(a)*r).toFixed(1),cy:(C+Math.sin(a)*r).toFixed(1),r:rand(2,6).toFixed(1),style:'animation-delay:'+rand(.3,3.6).toFixed(2)+'s'}));
    }
  }

  bakeBtn.addEventListener('click',function(){
    if(bakeBtn.disabled) return;
    if(!topsDone()&&!warned){warned=true;say('الوصفة لم تكتمل. اضغط مرة أخرى للخبز على أي حال.',true);return}
    S.baking=true; render();
    stage.classList.add('baking'); svg.classList.add('baked');
    bakeBtn.hidden=true; prog.hidden=false;
    void prog.offsetWidth; fill.style.width='100%';
    addSpots();
    bakeTimer=setTimeout(finish,BAKE_MS);
  });
  undoBtn.addEventListener('click',function(){
    if(S.baking||S.baked||!S.dough) return;
    if(tops.length){tops.pop().node.remove()}
    else if(S.cheese){gCheese.innerHTML='';S.cheese=false}
    else if(S.sauce){gSauce.innerHTML='';S.sauce=false}
    else{gDough.innerHTML='';S.dough=false}
    render();
  });

  function finish(){
    function spread(){var q={},ov=0,i,j;tops.forEach(function(o){var k=(o.x<C?0:1)+(o.y<C?0:2);q[k]=(q[k]||0)+1});
      for(i=0;i<tops.length;i++)for(j=i+1;j<tops.length;j++){if(Math.hypot(tops[i].x-tops[j].x,tops[i].y-tops[j].y)<(tops[i].s+tops[j].s)*.32)ov++}
      return {ok:(tops.length<6||Object.keys(q).length>=4)&&ov<=1,quad:Object.keys(q).length,ov:ov,minq:Object.keys(q).length<4?0:Math.min.apply(null,Object.keys(q).map(function(k){return q[k]}))}}
    S.baking=false; S.baked=true;
    stage.classList.remove('baking'); prog.hidden=true;
    var R=RECIPES[current], stars=1, text='';
    if(current==='free'){
      var types=Object.keys(TOP).filter(function(t){return count(t)>0}).length;
      var sp=spread();
      if(tops.length>=4&&types>=2) stars=2;
      text=[
        'خرجت من الفرن بجبن ذائب. جرّب إضافات أكثر ومن أنواع مختلفة.',
        'تشكيلة جميلة ومتنوعة، وهذا أعلى تقييم للبيتزا الحرة.',
        'تنوّع ممتاز وتوزيع متوازن. بيتزا تستحق أن تُقدَّم.'
      ][stars-1];

    for(var i=0;i<n;i++){var t=i/n; dd[i]=(Math.random()*2-1)*Math.sin(Math.PI*t)*Math.pow(1-t,.5)}
    var s=AC.createBufferSource(); s.buffer=b;
    var f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=.7;
    f.frequency.setValueAtTime(1000,AC.currentTime); f.frequency.linearRampToValueAtTime(3400,AC.currentTime+.45);
    var g=AC.createGain(); g.gain.value=.2;
    s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
  }catch(e){}}
  function go(d,q){var n=bkPos+d; if(n<0||n>bkN) return;

    s+='</g>';
    for(i=0;i<7;i++){a=(i<4?-0.5:2.2)+i*0;}

       '<path d="M100 100 Q112 78 104 56 T108 12" stroke="#ffe27a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".75" transform="translate(-2 0)"/>'+
       '<path d="M100 100 Q90 76 98 52 T94 14" stroke="#ffe27a" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".7" transform="translate(2 0)"/>'+

  function buildBk(pg){
    var bk=$('#bk'), ix=['',''];
    ORDER.forEach(function(k,n){var d=DIFF[k]; ix[n<10?0:1]+='<button class="idx" type="button" data-r="'+k+'"><b class="num">'+fmt(n+1)+'</b>'+mini(k)+'<span>'+RECIPES[k].name+'</span><i class="dots"></i><span class="dd d'+d+'">'+LV[d]+'</span><span class="rstars">'+starsOf(k)+'</span></button>'});
    var P=[
      [coverHTML(),titlePage()],

    ];
    var ks=ORDER, pr=[[legendPage(),'<h3 class="bt">فهرس الوصفات</h3><p class="bp">من الأسهل إلى الأصعب. اضغط على وصفة لتبدأ.</p><div class="idxs">'+ix[0]+'</div>'],['<h3 class="bt">تابع الفهرس</h3><div class="idxs">'+ix[1]+'</div>', pg[ks[0]]]];

    });

    }).join('');

    $$('.tab').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();jump(+b.dataset.sp)})});
    bkView(false);
  }
